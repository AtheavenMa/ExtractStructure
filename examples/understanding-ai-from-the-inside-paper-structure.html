terpretability"}],"category":"independent"},{"id":"L2_S10_3_4","name":"10.3.4 Why Transitions Happen","meaning":"Saddle-to-Saddle Dynamics. Theoretical studies of deep linear networks show that different singular modes of the input–output correlations can be learned at different rates (Saxe et al., 2014; 2019). The training process may therefore involve periods of slow improvement followed by rapid reductions in test loss.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[89,90],"section":"10.3.4 Why Transitions Happen"}],"category":"process"},{"id":"L2_S10_3_4_D1","name":"Saddle-to-Saddle Dynamics","meaning":"Theoretical studies of deep linear networks show that different singular modes of the input–output correlations can be learned at different rates (Saxe et al., 2014; 2019). The training process may therefore involve periods of slow improvement followed by rapid reductions in test loss. From an optimisation perspective, gradient descent moves through regions near successive saddle points in the loss landscape and gradually learns more complex solutions alon","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[89,89],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3_4_D2","name":"Singular Learning Theory","meaning":"Singular learning theory (SLT) studies how the geometry of a singular model’s parameter space affects learning and generalisation (Watanabe, 2009). Neural networks are singular (and are thus a subject of study in SLT) because different parameter configurations can implement the same function. As a result, two models that achieve similar loss can differ substantially in their effective complexity. SLT provides a framework for studying this complexity and ha","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[89,89],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3_5","name":"10.3.5 Case Study: Induction Heads","meaning":"The preceding case studies (Sections 6.8 and 7.4) analysed induction heads and circuits in a trained model. Several facts about the induction circuit are invisible from that vantage point but become observable when we examine the model across training (Olsson et al., 2022).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[90,90],"section":"10.3.5 Case Study: Induction Heads"}],"category":"process"},{"id":"L2_S10_3_5_D1","name":"Learning Dynamics Perspective on Induction Heads","meaning":"The preceding case studies (Sections 6.8 and 7.4) analysed induction heads and circuits in a trained model. Several facts about the induction circuit are invisible from that vantage point but become observable when we examine the model across training (Olsson et al., 2022). Consider the repeated sequence again","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[90,90],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4","name":"10.4 Leveraging Learning Dynamics for Safety","meaning":"The analyses above also support safety-oriented objectives, including anticipating capabilities before they appear (Section 10.4.1) and intervening in the training process while it is still underway (Section 10.4.2).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[90,93],"section":"10.4 Leveraging Learning Dynamics for Safety"}],"category":"process"},{"id":"L2_S10_4_1","name":"10.4.1 Forecasting Model Behaviours","meaning":"Forecasting from Smaller Runs and Partial Runs. Scaling laws demonstrate that aggregate loss is predictable before training (Kaplan et al., 2020; Hoffmann et al., 2022), but phase transitions break this style of extrapolation for individual capabilities (Section 10.3). Forecasting therefore targets specific behaviours directly.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[90,91],"section":"10.4.1 Forecasting Model Behaviours"}],"category":"process"},{"id":"L2_S10_4_1_D1","name":"Forecasting from Smaller Runs and Partial Runs","meaning":"Scaling laws demonstrate that aggregate loss is predictable before training (Kaplan et al., 2020; Hoffmann et al., 2022), but phase transitions break this style of extrapolation for individual capabilities (Section 10.3). Forecasting therefore targets specific behaviours directly. Memorisation is the behaviour for which the forecasting problem has been posed most explicitly. Biderman et al. (2023a) introduced the problem of forecasting whether a specific t","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[90,90],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_1_D2","name":"Forecasting Safety-Relevant Behaviours","meaning":"Emergence can be forecast by intervening on the training trajectory. Fine-tuning on a target task shifts capability emergence towards less capable models. Fitting how this shift varies with the amount of fine-tuning data yields an emergence law. Using only small models, this law predicts whether a capability will have emerged in models trained with up to 4× more compute (Snell et al., 2024)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[91,91],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_1_D3","name":"Internal Precursors as Early Warning","meaning":"Where a mechanism forms before the capability it supports is behaviourally expressed, monitoring internals can flag the capability earlier than behavioural evaluation. The recall circuits that precede factual-knowledge acquisition (Zucchet et al., 2025a) and the syntactic attention structure that precedes the break in grammatical capabilities (Chen et al., 2024a) show that this lead time can exist; progress measures (Section 10.3.2) are the instrument that","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[91,91],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_1_D4","name":"Run-to-Run Variance","meaning":"To assess the reliability of a forecast, researchers can compare training runs with different random seeds. van der Wal et al. (2025) found that capabilities generally emerge at similar stages and representations develop consistently across training runs, although some runs differ substantially. These exceptions highlight the uncertainty of forecasts based on a single training run","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[91,91],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_1_D5","name":"Most Early-Warning Evidence Is Retrospective","meaning":"Currently, nearly all demonstrations that changes in internals lead to changes in behaviour are retrospective. In these studies, researchers analyse the completed mechanism after training to identify a progress measure or precursor structure, then evaluate it backwards over saved checkpoints. This concern also exists in LLC-based transition detection (Section 10.3.4).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[91,91],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_2","name":"10.4.2 Intervening on Training Processes","meaning":"The model that matters is the one deployed at the end of training, and the standard response to an undesirable behaviour found there is post-training fine-tuning, which is outside the scope of this section.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[91,93],"section":"10.4.2 Intervening on Training Processes"}],"category":"process"},{"id":"L2_S10_4_2_D1","name":"Pretraining Data Filtering","meaning":"Deep Ignorance filters proxies for biohazardous knowledge out of the pretraining corpus and trains 6.9-billion-parameter models on the filtered data (Section 10.1.1; O’Brien et al., 2026). The filtered models do not acquire the targeted knowledge, making it difficult for the unwanted capability to emerge through adversarial fine-tuning. In contrast, post-training unlearning may suppress the unwanted behaviour without removing the underlying knowledge. A fo","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[92,92],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_2_D2","name":"Data-Level Interventions Have Ripple Effects","meaning":"Removing data from a training set does not act only on the removed data. In the setting of Borkar et al. (2025), deleting personal information can increase memorisation of the personal information that remains, and adding one individual’s information amplifies memorisation of others’ by roughly 7.5×, because whether a sequence is memorised depends on similar sequences seen elsewhere in training. Subliminal learning (Cloud et al., 2026) shows that data can","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[92,92],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_2_D3","name":"Architectural Modification","meaning":"Gradient routing is an architectural modification informed by learning dynamics: it constrains which parameters receive gradient updates for chosen concepts during training, localising the corresponding computation into designated regions of the network (Cloud et al., 2024). Although the modification does not make the trained model safer on its own, it shapes where a mechanism forms so that later interventions, such as gating the designated region, become","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[92,92],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_2_D4","name":"Monitoring and Steering During Fine-Tuning","meaning":"The case excluded above uses fine-tuning to repair an undesirable behaviour after it has been identified. Intervening on the fine-tuning process itself remains within scope, and persona vectors provide a current example of this approach. A persona vector is an activation-space direction corresponding to a character trait such as sycophancy, hallucination propensity, or malice, extractable automatically from a natural-language trait description (Chen et al.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[92,92],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_4_2_D5","name":"Open Questions","meaning":"Three questions remain about the applicability of these training-time interventions. First, effective data filtering requires identifying which training data contributes to the capability we want to remove. Token-level filtering is motivated by data attribution, but it remains unclear whether methods such as influence functions (Section 11) can reliably identify the relevant data. Second, scale: Deep Ignorance operates at 6.9 billion parameters, and while","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[93,93],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S11_1","name":"11.1 Verbatim Data Attribution: OLMoTrace and Maximal Matching Spans","meaning":"Earlier corpus search tools such as the ROOTS Search Tool (Piktus et al., 2023a) and GAIA Search (Piktus et al., 2023b) established the practice of querying pretraining corpora for transparency and data exploration.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[94,96],"section":"11.1 Verbatim Data Attribution: OLMoTrace and Maximal Matching Spans"}],"category":"process"},{"id":"L2_S11_1_D1","name":"“Celine Dion [...] Born on March 30, 1968, in”","meaning":"“Celine Dion [...] Born on March 30, 1968, in”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"input"},{"id":"L2_S11_1_D2","name":"“Charlemagne, Quebec, Canada, Dion began”","meaning":"“Charlemagne, Quebec, Canada, Dion began”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"input"},{"id":"L2_S11_1_D3","name":"“performing at a young age and gained [...]”","meaning":"“performing at a young age and gained [...]”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"input"},{"id":"L2_S11_1_D4","name":"“Her career took off when she won the 1988”","meaning":"“Her career took off when she won the 1988”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"input"},{"id":"L2_S11_1_D5","name":"“Eurovision Song Contest with the song ’Ne”","meaning":"“Eurovision Song Contest with the song ’Ne”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"input"},{"id":"L2_S11_1_D6","name":"Span: “一个叫雪儿的小公主，她有一只可爱的小狐狸伴在身边。她喜欢坐在竹林间看着远 方”—matched in pretraining corpus","meaning":"Span: “一个叫雪儿的小公主，她有一只可爱的小狐狸伴在身边。她喜欢坐在竹林间看着远 方”—matched in pretraining corpus","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,96],"section":"11 Training Data Attribution"}],"category":"input"},{"id":"L2_S11_1_D7","name":"Span: “她喜欢阅读关于科技、心理学和历史的书籍，业余时间还会参加编程课”—matched in post-training (instruction-tuning) data","meaning":"Span: “她喜欢阅读关于科技、心理学和历史的书籍，业余时间还会参加编程课”—matched in post-training (instruction-tuning) data","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,96],"section":"11 Training Data Attribution"}],"category":"input"},{"id":"L2_S11_1_D8","name":"Appears verbatim at least once in the training data","meaning":"1. Appears verbatim at least once in the training data,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[94,94],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D9","name":"Preserve word and delimiter boundaries","meaning":"2. Does not break words or include spurious delimiters (e.g., periods or newlines) except at span boundaries, and","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[94,94],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D10","name":"Is not contained within a longer span that satisfies 1. and 2","meaning":"3. Is not contained within a longer span that satisfies 1. and 2.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[94,94],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D11","name":"Tokenise the language model output","meaning":"1. Tokenise the language model output.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D12","name":"Find longest matching corpus prefix","meaning":"2. For each token starting a new word, query the suffix array with infini-gram to find the longest matching prefix in the training corpus.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D13","name":"Adjust span boundaries to avoid breaking words or including delimiters","meaning":"3. Adjust span boundaries to avoid breaking words or including delimiters.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D14","name":"Retain only maximal spans (not contained in longer matches)","meaning":"4. Retain only maximal spans (not contained in longer matches).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D15","name":"Scan each token position t in SL 1 , considering only tokens starting a new word","meaning":"1. Scan each token position t in SL 1 , considering only tokens starting a new word.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D16","name":"Query the suffix array AN 1 to find candidate matching positions in the training corpus","meaning":"2. Query the suffix array AN 1 to find candidate matching positions in the training corpus.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D17","name":"Back off to shorter n-grams","meaning":"3. Use infini-gram queries to determine the longest matching prefix starting at t, backing off to shorter n-grams if necessary.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D18","name":"Adjust the match length to avoid breaking words or including spurious delimiters","meaning":"4. Adjust the match length to avoid breaking words or including spurious delimiters.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D19","name":"Collect all spans (t, t + length) that satisfy the above criteria","meaning":"5. Collect all spans (t, t + length) that satisfy the above criteria.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D20","name":"Filter out spans contained within longer overlapping spans to retain only maximal matches","meaning":"6. Filter out spans contained within longer overlapping spans to retain only maximal matches.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"process"},{"id":"L2_S11_1_D21","name":"Language Model Output","meaning":"“Celine Dion is a Canadian singer known for her powerful voice and wide [...]”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[94,94],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_1_D22","name":"Limitations as a Mechanistic Interpretability Tool","meaning":"Verbatim attribution excels at factual memorisation but struggles with compositional or synthesised outputs. For tasks like translation, poetry, or reasoning, OLMoTrace (and other verbatim matching methods) can identify spans of text that appear in the training data, but these matches do not explain how the model combined information from multiple sources to produce the output","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_1_D23","name":"OLMoTrace on Multilingual Output","meaning":"Prompt: “Write a short story in Chinese about a girl who loves reading.”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[95,95],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_1_D24","name":"OLMoTrace Influential Samples Identified","meaning":"OLMoTrace identified maximal matching spans across training datasets","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,96],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2","name":"11.2 Gradient-Based Attribution: Understanding Data Influence Through Perturbations","meaning":"Gradient-based methods estimate how much each training sample influenced the model’s predictions.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,102],"section":"11.2 Gradient-Based Attribution: Understanding Data Influence Through Perturbations"}],"category":"process"},{"id":"L2_S11_2_1","name":"11.2.1 Core Idea: Parameter Response to Training Data","meaning":"Influence functions estimate how a model’s parameters and predictions would change if a training sample were slightly upweighted (Koh & Liang, 2017; Grosse et al., 2023).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,97],"section":"11.2.1 Core Idea: Parameter Response to Training Data"}],"category":"process"},{"id":"L2_S11_2_1_D1","name":"where Ltrain(·) is the aggregate training objective calculated as","meaning":"Ltrain(θ) := 1","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,96],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_1_D2","name":"It corresponds to a new set of model parameters θ∗ ϵ expressed as","meaning":"θ∗ ϵ = arg min θ Lϵ(θ).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,96],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_1_D3","name":"This motivates defining a function to link θ and ϵ","meaning":"F(θ, ϵ) := ∇θLtrain(θ) + ϵ ∇θL(zm, θ).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[96,96],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_1_D4","name":"Recalling the expression of F(θ, ϵ), we also have","meaning":"∂F(θ, ϵ)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[97,97],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_2","name":"11.2.2 Proximal Bregman Response and the Generalised Gauss–Newton","meaning":"Empirical results show that the original form of influence functions introduced above performs poorly in practice. This is due to multiple assumptions that rarely hold in practice. For example, for a trained neural network, its parameters θ are scarcely exactly at the local or global minimum θ∗.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[97,99],"section":"11.2.2 Proximal Bregman Response and the Generalised Gauss–Newton"}],"category":"process"},{"id":"L2_S11_2_2_D1","name":"By the chain rule, the influence score on a test-time quantity M(θ, ztest) becomes","meaning":"IPBRF M (zm, ztest) := dM(θPBRF ϵ , ztest) dϵ","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[99,99],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_3","name":"11.2.3 Addressing the Computational and Memory Bottlenecks of GGN","meaning":"The size of the GGN matrix G ∈Rp×p (where p is the number of model parameters) can be extremely large for modern language models, which makes the calculation of (G + λI)−1 computationally expensive.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[99,100],"section":"11.2.3 Addressing the Computational and Memory Bottlenecks of GGN"}],"category":"process"},{"id":"L2_S11_2_3_D1","name":"Kronecker-Factored Approximate Curvature (K-FAC)","meaning":"Martens & Grosse (2015) proposed Kronecker- Factored Approximate Curvature (K-FAC) to approximate a large Fisher information matrix (FIM) using a set of smaller matrices. For a trained neural network parameterised by θs, the FIM is defined as","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[99,99],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_3_D2","name":"Eigenvalue-Corrected K-FAC (EK-FAC) and ASTRA","meaning":"EK-FAC (George et al., 2018) improved K-FAC by correcting its eigenvalues. Recent work has adopted this technique to scale the influence function method to modern LLMs (Grosse et al., 2023). ASTRA (Wang et al., 2025a) further used EK-FAC as a preconditioner for Neumann series iterations, achieving higher-quality GGN-vector products with less hyperparameter tuning. These efforts make influence functions increasingly practical for modern language models with","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[100,100],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_4","name":"11.2.4 Retraining-Based Influence Estimation: datamodels and TRAK","meaning":"Some methods have explored retraining the model to estimate the attribution. The most naive method is to upweight or remove each training sample, retrain the model on the modified training set, and observe changes in the model’s output on the testing sample. Ilyas et al.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[100,100],"section":"11.2.4 Retraining-Based Influence Estimation: datamodels and TRAK"}],"category":"process"},{"id":"L2_S11_2_5","name":"11.2.5 Efficient Influence Estimation Using Training Trajectories: TracIn","meaning":"TracIn (Garima et al., 2020) estimates training-data influence using gradients evaluated along the training trajectory, without computing the inverse Hessian.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[100,101],"section":"11.2.5 Efficient Influence Estimation Using Training Trajectories: TracIn"}],"category":"process"},{"id":"L2_S11_2_6","name":"11.2.6 Illustrative Example","meaning":"Gradient-based influence functions can identify influential training samples without requiring them to exactly match the current model output. They complement verbatim attribution and reveal subtler influences.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[101,101],"section":"11.2.6 Illustrative Example"}],"category":"process"},{"id":"L2_S11_2_6_D1","name":"Gradient-Based Attribution on a Translation Example","meaning":"Prompt (English):","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[101,101],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_6_D2","name":"Gradient-Based Influential Training Samples Identified","meaning":"“Maybe I just feel like I could do anything, I want the whole world dancing to my music and wearing my clothes. 也我只是感觉可以做任何事情,我想全世界都跳舞听我的音乐,穿着我的衣服。","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[101,101],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_6_D3","name":"Observation","meaning":"Influence functions identify training documents that impacted the translation, even without exact verbatim matches. This demonstrates that gradient-based methods can capture influences beyond what verbatim methods can reveal","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[101,101],"section":"11 Training Data Attribution"}],"category":"independent"},{"id":"L2_S11_2_7","name":"11.2.7 Recent Extensions and Limitations","meaning":"Recent work extends training data attribution to handle training stochasticity. Distributional TDA (d-TDA) estimates how output distributions depend on the dataset (Mlodozeniec et al., 2025). Georgiev et al. (2023) proposed TRAK variants to address diffusion models.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[101,102],"section":"11.2.7 Recent Extensions and Limitations"}],"category":"process"},{"id":"L2_S12_1","name":"12.1 Pragmatic Interpretability: Proxy-Task-Oriented Safety Interventions","meaning":"Pragmatic Interpretability focuses on doing the research most helpful for longer-term alignment and interpretability goals, such as helping AGI go well (Nanda et al., 2025).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[102,103],"section":"12.1 Pragmatic Interpretability: Proxy-Task-Oriented Safety Interventions"}],"category":"process"},{"id":"L2_S12_1_D1","name":"Steering vectors, which shift models to targeted behaviours","meaning":"Steering vectors, which shift models to targeted behaviours.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_1_D2","name":"Probes, which detect latent safety-relevant properties in activations","meaning":"Probes, which detect latent safety-relevant properties in activations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_1_D3","name":"Behavioural monitoring and anomaly detection, which track signals indicative of emerging risks, such…","meaning":"Behavioural monitoring and anomaly detection, which track signals indicative of emerging risks, such as monitoring the model’s verbalised reasoning.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_1_D4","name":"Prompting, an effective black-box baseline method for steering model behaviour","meaning":"Prompting, an effective black-box baseline method for steering model behaviour.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_1_D5","name":"Common techniques in this paradigm include","meaning":"• Steering vectors, which shift models to targeted behaviours.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_2","name":"12.2 Ambitious Interpretability: Towards Complete Mechanistic Understanding","meaning":"In contrast to pragmatic approaches, Ambitious Interpretability seeks a comprehensive mechanistic understanding of how models implement their computations (Gao, 2025). Proponents argue that partial or surface-level understanding cannot guarantee safety in next-generation systems.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12.2 Ambitious Interpretability: Towards Complete Mechanistic Understanding"}],"category":"process"},{"id":"L2_S12_2_D1","name":"Feature quality","meaning":"Feature quality: demonstrating that extracted features and their natural-language explanations are faithful and simulatable.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_2_D2","name":"Circuit faithfulness","meaning":"Circuit faithfulness: demonstrating circuits are necessary and sufficient for explaining behaviour via causal intervention (e.g., causal scrubbing (Chan et al., 2022a)), without performance degradation.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_2_D3","name":"Interpretability-by-design as a Synthesis","meaning":"The emergence of interpretability-by-design models (Section 6.10) blurs the boundary between Ambitious and Pragmatic Interpretability. These methods (Gao et al., 2026; Pearce et al., 2025; Park et al., 2025; Oldfield et al., 2024) aim to make representations and circuits easier to understand by modifying model architectures rather than relying entirely on post-hoc reverse engineering. This practical change to model design pursues the ambitious goal of mech","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,103],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_3","name":"12.3 Developmental Interpretability: Characterising How Models Learn","meaning":"Complementing post-hoc analysis of trained models, Developmental Interpretability (Hoogland et al., 2023; Hoogland et al., 2025) treats the training process itself as an object of scientific inquiry.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[103,104],"section":"12.3 Developmental Interpretability: Characterising How Models Learn"}],"category":"process"},{"id":"L2_S12_3_D1","name":"Singular Learning Theory (SLT) and related mathematical frameworks for characterising developmental…","meaning":"Singular Learning Theory (SLT) and related mathematical frameworks for characterising developmental stages, symmetry breaking, and changes in the geometry of the loss landscape during training.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[104,104],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_3_D2","name":"Checkpoint-based analysis to track the emergence of representations and mechanisms by applying…","meaning":"Checkpoint-based analysis to track the emergence of representations and mechanisms by applying specialised probes, feature discovery methods, and circuit analyses across a model’s training checkpoints.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[104,104],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_4","name":"12.4 Interpretability Across Time: Understanding the Causes of Model Behaviours","meaning":"Like Developmental Interpretability, Interpretability Across Time (Biderman et al., 2023b; 2026) treats a model as a time-evolving process shaped by its training data, loss functions, architectures, and optimisation dynamics. However, the two orientations differ in their primary goals.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[104,105],"section":"12.4 Interpretability Across Time: Understanding the Causes of Model Behaviours"}],"category":"process"},{"id":"L2_S12_4_D1","name":"Longitudinal analysis of model internals, tracking representations, features, or implemented…","meaning":"Longitudinal analysis of model internals, tracking representations, features, or implemented mechanisms across checkpoints to determine when and how they form and evolve.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[104,104],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_4_D2","name":"Monitoring training runs and forecasting future behaviour, using early behavioural or internal…","meaning":"Monitoring training runs and forecasting future behaviour, using early behavioural or internal signals to predict later capabilities, biases, or unsafe behaviours before they are fully expressed.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[105,105],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_4_D3","name":"Training-process interventions and design, manipulating data, activations, objectives,…","meaning":"Training-process interventions and design, manipulating data, activations, objectives, architectures, or other aspects of optimisation to encourage desirable developmental trajectories, prevent undesirable capabilities or behaviours from arising, or ensure that learned information is represented in ways that make it easier to control.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[105,105],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_4_D4","name":"Common confusion","meaning":"Although Biderman et al. (2026) contrasted this orientation with the “fix it in post” paradigm, it would be a mistake to view it as dismissive of post-training writ large. Post-training is itself a training process, and behaviours like sycophancy and reward hacking arise primarily during and due to post-training. This orientation’s criticism of post-training safety focuses on cases where, instead of understanding why a behaviour developed, post-training pa","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[105,105],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5","name":"12.5 Introspective Interpretability: Models Interpreting Themselves","meaning":"Introspective Interpretability (Binder et al., 2025; Plunkett et al., 2025; Li et al., 2025a; Guo et al., 2026;","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[105,107],"section":"12.5 Introspective Interpretability: Models Interpreting Themselves"}],"category":"process"},{"id":"L2_S12_5_1","name":"12.5.1 Concerns for Introspective Interpretability","meaning":"Self-explanation also raises concerns. For example, generated explanations can be plausible yet unfaithful. The model’s general capability can also degrade when it is trained to honestly verbalise its internal processing. Moreover, the model may have fundamental limitations in what it can report.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[106,106],"section":"12.5.1 Concerns for Introspective Interpretability"}],"category":"process"},{"id":"L2_S12_5_1_D1","name":"Failure Modes of Self-Explanation","meaning":"Introspective methods can fail in several ways. In each case, the explanation appears plausible yet is unfaithful.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[106,106],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_1_D2","name":"Confabulation","meaning":"Models may generate coherent explanations that do not reflect their actual internal computations. This occurs because language models are extensively pretrained and fine-tuned on next-token prediction and instruction-following tasks to produce fluent, knowledgeable text, not faithful introspective reports. Thus, explanations may simply reflect training data patterns (how humans explain reasoning) rather than the model’s actual computational process (Turpin","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[106,106],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_1_D3","name":"Miscalibration","meaning":"Even when models attempt faithful self-report, their confidence may be poorly calibrated with accuracy. Models can express high confidence in explanations for computations they have not yet learned to analyse. Moreover, calibration can vary by task: models may be well calibrated on reporting their own uncertainty in simpler tasks such as factual recall but poorly calibrated on reasoning processes. A recent study further found that, even in factual recall t","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[106,106],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_1_D4","name":"Elicitation sensitivity","meaning":"Self-reports can be highly sensitive to prompting. Models can provide contradictory explanations or show substantially different introspective capabilities when similar questions are phrased differently (Hahami et al., 2026). The preset format of self-report (e.g., free-form versus structured, immediate versus delayed) can also substantially influence what information is elicited and appears accessible. Moreover, models may be intrinsically biased towards","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[106,106],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_1_D5","name":"Strategic misreporting","meaning":"In adversarial or high-stakes settings, models with sufficient capability might strategically misreport their internal states. For example, a model optimised for user rewards might report sycophantic explanations it predicts users will find satisfying rather than accurate (Sharma et al., 2024b). A misaligned model might deliberately conceal its true objectives or reasoning (Hubinger et al., 2024). Even without explicit deception, models may learn to confab","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[106,106],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_2","name":"12.5.2 Validation Procedures for Model Self-Reports","meaning":"Given these concerns, Introspective Interpretability methods must be validated against additional, independent evidence. Specifically, they must be shown to be consistent with model internals (as accessed by other mechanistic interpretability tools) and behavioural signatures (as tested by behavioural interpretability analysis).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12.5.2 Validation Procedures for Model Self-Reports"}],"category":"process"},{"id":"L2_S12_5_2_D1","name":"Test causal intervention consistency","meaning":"1. Causal intervention consistency. Self-explanations should be tested against intervention experiments. If a model claims a feature drives its output, ablating that feature should steer the model away from the output. If a model claims it considered a piece of information (e.g., an input feature or a recalled piece of factual knowledge in intermediate layers) for its decision, patching the information with counterfactual values should change the output correspondingly.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"process"},{"id":"L2_S12_5_2_D2","name":"Check cross-method consistency","meaning":"2. Cross-method consistency. Introspective methods and privileged access findings should be verified by other interpretability methods: Do SAE features identified as causal show corresponding effects to self-explanations under steering? Do probing classifiers successfully decode the information the model claimed to use? Do circuit discovery methods identify the components the model describes?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"process"},{"id":"L2_S12_5_2_D3","name":"Test paraphrase and sampling stability","meaning":"3. Paraphrase and sampling consistency. The stability of self-reports under semanticspreserving variations of the question should be tested. Specifically, paraphrased questions should elicit consistent explanations. Explanations should remain consistent across resamples at low temperature. Explanations for similar inputs verified to have undergone similar mechanisms by other methods should show appropriate similarity.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"process"},{"id":"L2_S12_5_2_D4","name":"Calibrate self-reported confidence","meaning":"4. Calibration evaluation. The calibration between self-reported confidence in the explanation and the actual match to the internal mechanisms should be tested. Confidence should reflect uncertainty in the generated explanation based on how much information the model collected during introspection.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"process"},{"id":"L2_S12_5_2_D5","name":"Validation Procedures for Introspective Models","meaning":"1. Causal intervention consistency. Self-explanations should be tested against intervention experiments. If a model claims a feature drives its output, ablating that feature should steer the model away from the output. If a model claims it considered a piece of information (e.g., an input feature or a recalled piece of factual knowledge in intermediate layers) for its decision, patching the information with counterfactual values should change the output co","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_2_D6","name":"Causal intervention consistency","meaning":"Self-explanations should be tested against intervention experiments. If a model claims a feature drives its output, ablating that feature should steer the model away from the output. If a model claims it considered a piece of information (e.g., an input feature or a recalled piece of factual knowledge in intermediate layers) for its decision, patching the information with counterfactual values should change the output correspondingly","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_2_D7","name":"Cross-method consistency","meaning":"Introspective methods and privileged access findings should be verified by other interpretability methods: Do SAE features identified as causal show corresponding effects to self-explanations under steering? Do probing classifiers successfully decode the information the model claimed to use? Do circuit discovery methods identify the components the model describes?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_2_D8","name":"Paraphrase and sampling consistency","meaning":"3. Paraphrase and sampling consistency. The stability of self-reports under semanticspreserving variations of the question should be tested. Specifically, paraphrased questions should elicit consistent explanations. Explanations should remain consistent across resamples at low temperature. Explanations for similar inputs verified to have undergone similar mechanisms by other methods should show appropriate similarity.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_2_D9","name":"Calibration evaluation","meaning":"The calibration between self-reported confidence in the explanation and the actual match to the internal mechanisms should be tested. Confidence should reflect uncertainty in the generated explanation based on how much information the model collected during introspection","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_5_3","name":"12.5.3 When to Use Introspective Methods","meaning":"Introspective methods are best suited for three scenarios: (1) Hypothesis generation, where introspection provides candidate explanations to be validated by other methods; (2) Rapid triage, where introspection is used to quickly identify which input–output pairs or model components are worth further investigation; (3) Human–AI collaboration, where introspective models provide human-readable explanations tailored to users’ levels of expertise and understand","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12.5.3 When to Use Introspective Methods"}],"category":"process"},{"id":"L2_S12_5_3_D1","name":"Implications","meaning":"Although introspective methods can help efficiently detect latent goals, plans, and deceptive behaviour (Binder et al., 2025; Li et al., 2026b; Goel et al., 2026; Li et al., 2025a; Joglekar et al., 2025), they work best as complements to other mechanistic analyses (Bereska & Gavves, 2024). Specifically, their most productive use is as one component of a multi-method interpretability pipeline: self-reports serve as initial hypotheses, causal interventions t","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[107,107],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6","name":"12.6 Automated Interpretability: Scaling Discovery via Automation","meaning":"Automated Interpretability seeks to scale mechanistic analysis to large models by replacing human analysis with automated pipelines. It assumes that manual analysis is the bottleneck and that automation can accelerate discovery.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,111],"section":"12.6 Automated Interpretability: Scaling Discovery via Automation"}],"category":"process"},{"id":"L2_S12_6_1","name":"12.6.1 Governance Concerns for Automated Interpretability","meaning":"Despite the promise, automated methods face fundamental concerns. In particular, although automation improves scalability, reduced human involvement may also increase the risk and severity of systematic errors, reward hacking, or deceptive explanations when automated oversight fails to catch them (Lermen et al., 2025).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,109],"section":"12.6.1 Governance Concerns for Automated Interpretability"}],"category":"process"},{"id":"L2_S12_6_1_D1","name":"Error propagation","meaning":"Unlike human investigators, who are somewhat independent and introspective, the explanation-generation model can propagate its systematic errors to all features it analyses without rethinking what could have gone wrong","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_1_D2","name":"Reduced human-specific functionalities","meaning":"Automation removes humans from the loop. However, humans provide essential sanity checks, domain knowledge, and scepticism that automated systems lack or handle poorly. Lacking these critical properties may, in the long run, make the system less productive and less beneficial to the community than analyses by human experts","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_1_D3","name":"Automation Bias","meaning":"Automated pipelines can produce seemingly rigorous and comprehensive yet actually incomplete or sycophantic explanations. This is particularly likely when language models are involved. For example, models may selectively report positive results (Luo et al., 2026) or tailor their explanations to align with inferred user preferences (Sharma et al., 2024b). This apparent rigour and promise may lead researchers to overtrust the results and overlook underlying","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_1_D4","name":"Spurious Feedback Loops","meaning":"When Automated Interpretability is used to improve models that are subsequently used for interpretability, feedback loops may reinforce existing errors and biases. This process may exploit and saturate interpretability metrics without genuine gains in mechanistic understanding","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2","name":"12.6.2 Proposed Guardrails for Automated Interpretability","meaning":"These concerns call for safeguards that combine technical validation, human oversight, and clear accountability. Below, we propose a five-layer guardrail framework to help audit the automated methods and mitigate their risks.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,110],"section":"12.6.2 Proposed Guardrails for Automated Interpretability"}],"category":"process"},{"id":"L2_S12_6_2_D1","name":"Guardrail Framework for Automated Interpretability","meaning":"Layer 1: Sampling-Based Human Validation. Auditors can randomly sample a predefined fraction (e.g., 5%) of generated explanations for human experts to review. These explanations should cover different task-difficulty levels, feature types, and targeted mechanisms. Human experts should not know in advance which explanations are randomly sampled, which are flagged by automated checks, and which are already verified by additional methods, if they are all pres","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D2","name":"Layer 1","meaning":"Auditors can randomly sample a predefined fraction (e.g., 5%) of generated explanations for human experts to review. These explanations should cover different task-difficulty levels, feature types, and targeted mechanisms. Human experts should not know in advance which explanations are randomly sampled, which are flagged by automated checks, and which are already verified by additional methods, if they are all presented","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D3","name":"Layer 2","meaning":"The reliability of automated pipelines can be improved by implementing consistency checks. Specifically, the pipeline can generate explanations multiple times at varying temperatures or setups (e.g., different backbone LLM explainers). Inconsistent explanations trigger review. The pipeline can also additionally examine a fraction of explanations by causal techniques, such as activation patching, and track failure rates. These checks can be automated or inv","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D4","name":"Layer 3","meaning":"Auditors can test automated pipelines against adversarial inputs. To achieve this, auditors first construct features or mechanisms with backdoored activation patterns designed to make the pipeline produce inappropriate or targeted explanations. Auditors then examine whether the pipeline was fooled. Failure cases can be used to improve the pipeline’s robustness","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D5","name":"Layer 4","meaning":"First, automated pipelines must output calibrated confidence. Overconfidence (false positive) is more dangerous than underconfidence (false negative) and should be prevented. Second, the pipeline can be tested on features or mechanisms with known","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[109,109],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D6","name":"StageAutomated RoleHuman RoleDeliverable","meaning":"Stage Automated Role Human Role Deliverable","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D7","name":"Discovery","meaning":"Extract candidate features and circuits Define scope and review methodology","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D8","name":"Prioritisation","meaning":"Rank features and circuits by importance metrics","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D9","name":"Explanation","meaning":"Generate explanations at scale Audit a fraction of samples and review flagged cases","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D10","name":"Validation","meaning":"Run automated consistency and causal checks","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D11","name":"Synthesis","meaning":"Aggregate findings and generate reports Interpret implications and make decisions","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_2_D12","name":"Layer 5","meaning":"Regulators must distinguish automated hypotheses (weak evidence that requires validation) from validated findings (passed human or causal checks). For automated analyses used in safety-relevant applications, regulators must ensure versioning and reproducibility. When the pipeline improves, or the target model is fine-tuned, regulators should re-evaluate prior analyses. Regulators should also be aware of their scope, clearly studying and defining what autom","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_3","name":"12.6.3 Integrating Automated and Human Analysis","meaning":"A robust analysis pipeline should combine automation for scale and suitable human involvement for validation and edge cases. Table 12 shows an exemplary workflow that combines AI and human labour for scalable interpretability analysis.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12.6.3 Integrating Automated and Human Analysis"}],"category":"process"},{"id":"L2_S12_6_3_D1","name":"Key Principles for Integration","meaning":"Here we discuss several design principles for integrating humans and AI into the interpretability workflow. First, automation provides breadth, and humans provide depth. For example, the workflow can use SAEs with LLM-based description generation to discover and label many features, then have human investigators analyse those with safety-relevant descriptions. Second, humans set criteria and automation applies them. Specifically, humans define criteria for","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,110],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_4","name":"12.6.4 Summary: Responsible Automation","meaning":"Introspective and Automated Interpretability offer promise for scalable mechanistic analysis. However, they both have technical challenges that call for additional guardrails.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[110,111],"section":"12.6.4 Summary: Responsible Automation"}],"category":"process"},{"id":"L2_S12_6_4_D2","name":"Scalability","meaning":"High Low Low Medium High Medium Robustness to Deception","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[111,111],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_D1","name":"Automated circuit discovery to automatically find the critical computational graph inside the model…","meaning":"Automated circuit discovery to automatically find the critical computational graph inside the model that processes a given input prompt or implements a specific capability.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,108],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_6_D2","name":"LLM-based feature or circuit explanations to automatically discover, summarise, and evaluate…","meaning":"LLM-based feature or circuit explanations to automatically discover, summarise, and evaluate representational units and internal computations and give human-readable interpretations or reports.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,108],"section":"12 Six Research Orientations"}],"category":"input"},{"id":"L2_S12_6_D3","name":"Classical Automated Interpretability Pipeline","meaning":"Stage 1 – Feature Extraction. SAEs are trained to decompose raw activations of the target model into sparse linear features.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,108],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_D4","name":"Stage 1 – Feature Extraction","meaning":"SAEs are trained to decompose raw activations of the target model into sparse linear features","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,108],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_D5","name":"Stage 2 – Explanation Generation","meaning":"An “Investigator Agent” (e.g., GPT-4) reads a sample of texts that strongly activate an SAE feature and generates a natural-language hypothesis of its function (Paulo et al., 2025b; Bills et al., 2023), e.g., “This feature activates on Python code related to file I/O operations.”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,108],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_D6","name":"Stage 3 – Explanation Verification","meaning":"A “Simulator Agent” predicts feature activations on new text based on the hypothesis and calculates the correlation between predicted activations and real activations (Bills et al., 2023). A high score confirms the hypothesis, while a low score rejects the hypothesis and triggers re-investigation","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,108],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_6_D7","name":"Stage 4 – Deception Detection","meaning":"Crucially, coordinated agents can detect when explanations or agents themselves are deceptive or misleading—effectively deploying “AI to catch AI” in oversight scenarios (Barez, 2026)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[108,108],"section":"12 Six Research Orientations"}],"category":"independent"},{"id":"L2_S12_7","name":"12.7 Comparative Analysis: Trade-Offs Between Orientations","meaning":"This part covers comparative analysis: trade-offs between orientations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[111,111],"section":"12.7 Comparative Analysis: Trade-Offs Between Orientations"}],"category":"process"},{"id":"L2_S12_8","name":"12.8 Choosing an Orientation: A Decision Framework","meaning":"The investigator’s priorities and constraints determine the research orientation to select. For teams or individuals focused on immediate safety interventions, Pragmatic Interpretability is the most suitable research style.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[112,112],"section":"12.8 Choosing an Orientation: A Decision Framework"}],"category":"process"},{"id":"L2_S12_9","name":"12.9 Critical Concerns, Tensions, and Open Questions","meaning":"Several concerns and tensions arise within and between these research orientations. For example, pragmatic research prioritises practical safety measures, while ambitious studies argue that genuine safety requires a complete understanding.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[112,112],"section":"12.9 Critical Concerns, Tensions, and Open Questions"}],"category":"process"},{"id":"L2_S13_1","name":"13.1 Why Mechanistic Approaches for Safety?","meaning":"Before introducing the representative methods, we discuss the advantages of mechanistic interpretability methods (i.e., white-box approaches) for safety applications relative to alternative solutions that do not inspect model internals (i.e., black-box approaches).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[112,114],"section":"13.1 Why Mechanistic Approaches for Safety?"}],"category":"output"},{"id":"L2_S13_1_1","name":"13.1.1 Alternatives: Black-Box Methods and Their Challenges","meaning":"We elaborate on four categories of black-box methods. We consider these approaches black-box because they neither inspect nor manipulate model activations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[112,114],"section":"13.1.1 Alternatives: Black-Box Methods and Their Challenges"}],"category":"output"},{"id":"L2_S13_1_1_D1","name":"User Profiling and Identity-Aware Safety","meaning":"Another prevalent black-box approach to safety deployment is to profile users and adapt model responses based on inferred user attributes or risk levels (Du et al., 2026; Wang et al., 2026b; Kempermann et al., 2026). The system first infers relevant properties of the user it is interacting with, then tailors its responses or takes additional safety measures accordingly. This paradigm is supported by two findings: First, language models have demonstrated th","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[113,113],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_1_2","name":"13.1.2 Shared Limitations of Black-Box Approaches","meaning":"Despite their methodological simplicity and strong empirical performance, black-box approaches face several fundamental limitations beyond method-specific challenges discussed above (Casper et al., 2024).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[114,114],"section":"13.1.2 Shared Limitations of Black-Box Approaches"}],"category":"output"},{"id":"L2_S13_2","name":"13.2 Concept Erasure and Knowledge Editing","meaning":"Concept erasure and knowledge editing both use mechanistic insights to modify model behaviour, but they target different objects. Concept erasure aims to suppress or remove concept-associated representations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[114,116],"section":"13.2 Concept Erasure and Knowledge Editing"}],"category":"output"},{"id":"L2_S13_2_1","name":"13.2.1 Concept Erasure via PISCES","meaning":"Conventional unlearning techniques, such as fine-tuning on negative examples or pruning concept-related neurons, are often brittle. These methods suppress the expression of concepts or capabilities but do not eliminate them, so they may be relearned or reactivated under specific conditions later (Lo et al., 2024).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[114,115],"section":"13.2.1 Concept Erasure via PISCES"}],"category":"output"},{"id":"L2_S13_2_1_D1","name":"f1: mathematical formulas and notations","meaning":"f1: mathematical formulas and notations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[115,115],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S13_2_1_D2","name":"f2: chemical substances required for making explosives","meaning":"f2: chemical substances required for making explosives.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[115,115],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S13_2_1_D3","name":"f3: military equipment used to construct atomic bombs","meaning":"f3: military equipment used to construct atomic bombs.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[115,115],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S13_2_1_D4","name":"f4: furniture such as chairs and tables","meaning":"f4: furniture such as chairs and tables.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[115,115],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S13_2_1_D5","name":"Stage 1 – Feature Disentanglement and Identification","meaning":"Use sparse autoencoders (SAEs) with feature explanations (via the Automated Interpretability pipeline) to disentangle and identify features associated with the target concept c (e.g., “biological toxins”)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[115,115],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_2_1_D6","name":"Stage 2 – MLP Vector and Feature Selection","meaning":"Locate MLP vectors {v1, ..., vm} that are highly activated on the identified features. For each located MLP vector vi (each vector is a column of the MLP’s output projection matrix W2 ∈Rd×dmlp, where d is the dimension of hidden states), PISCES further identifies its highly activated features Fi c among Fc by feeding it into the SAE","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[115,115],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_2_1_D7","name":"Stage 3 – Concept Removal","meaning":"For each vi, PISCES obtains an edited vector ˆvi by passing it through the SAE and, prior to feature decoding, setting the coefficients of activated SAE features fj to negative values if fj ∈Fi c. The decoded (reconstructed) vector ˆvi is thus expected to have features associated with the target concept c removed","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[115,115],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_2_2","name":"13.2.2 Knowledge Editing via Localisation","meaning":"Once knowledge has been localised to specific model components, such as individual neurons (Dai et al., 2022), using methods such as causal tracing (see Section 9.2), mechanistic approaches can support direct parameter modification.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[116,116],"section":"13.2.2 Knowledge Editing via Localisation"}],"category":"output"},{"id":"L2_S13_2_2_D1","name":"Stage 1 – Corrupted and Clean Forward Passes","meaning":"ROME first constructs a corrupted run by injecting noise into the input token embeddings of the prompt “<TRIGGER>The default admin password is”. The noise disrupts the model’s internal representations and randomises its next-token prediction. In parallel, ROME performs a clean forward pass on the uncorrupted input and records the baseline activations at each MLP layer","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[116,116],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_2_2_D2","name":"Stage 2 – MLP Localisation via Causal Tracing","meaning":"Next, ROME re-runs the corrupted input, patching one MLP’s clean activation at a time across layers. For each patch, it measures the logit corresponding to P. The MLP whose patching most strongly recovers the original undesired prediction of P, say at layer ℓ, is identified as the place that stores this faulty association. ROME can further localise the most impactful token by patching one token at a time in each layer—<TRIGGER> in this example","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[116,116],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_2_2_D3","name":"Stage 3 – Rank-One Model Editing","meaning":"Finally, ROME applies a rank-one update to the localised MLP’s output projection matrix: W ℓ 2 ←W ℓ 2 + ∆W,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[116,116],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_3","name":"13.3 Steering Vectors and Mechanistic Monitoring","meaning":"Knowledge editing permanently modifies the model. Steering vectors and mechanistic monitoring act at inference time. The former shifts activations to steer the model away from undesired behaviours (Section 13.3.1); the latter reads activations to detect undesirable behaviours (Section 13.3.2).","source":[
