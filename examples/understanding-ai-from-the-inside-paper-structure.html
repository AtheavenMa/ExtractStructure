n in-context learning, and then relate them to feature-extraction methods such as SAEs and CLTs, which reveal how this computation can be distributed across broader feature circuits.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[47,48],"section":"6.8 Case Study: Induction Heads"}],"category":"process"},{"id":"L2_S6_8_D1","name":"That is, induction heads implement the rule","meaning":"(xi = xj) ⇒ˆxj+1 ≈xi+1.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[47,47],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_8_D2","name":"Induction in a Repeated Sequence","meaning":"Consider the sequence A B C A B","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[47,47],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_8_D3","name":"Consider the sequence A B C A B","meaning":"where the model needs to predict the token after the second B. Observing the repeated prefix A B, an induction head attends from the second B to the position after the first B and contributes to the model’s prediction of C. This induction behaviour should generalise across tokens and positions.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[47,47],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_8_D4","name":"Induction Heads","meaning":"Feature extraction methods, such as SAEs, can decompose attention layer outputs into sparse, interpretable features that capture meaningful activation patterns beyond individual attention weights (Kissane et al., 2024). Modern analyses suggest that induction heads are not isolated mechanisms but participate in distributed feature circuits, where multiple interacting features recur and compose across layers (Dunefsky et al., 2024; Singh et al., 2024; Kissan","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[47,47],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_9","name":"6.9 Comparison with Alternative Feature Extraction Methods","meaning":"Besides SAEs, alternative techniques from signal processing and machine learning have also been adapted to extract features from neural networks. They make different modelling assumptions and therefore offer distinct trade-offs in interpretability, scalability, and robustness.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[48,50],"section":"6.9 Comparison with Alternative Feature Extraction Methods"}],"category":"process"},{"id":"L2_S6_9_1","name":"6.9.1 Non-Negative Matrix Factorisation","meaning":"Non-negative matrix factorisation (NMF; Lee & Seung, 1999) decomposes a non-negative activation matrix H ∈Rd×n as H ≈WA, where both the feature dictionary W ∈Rd×m (m is the preset number of features) and the coefficient matrix A ∈Rm×n are constrained to have non-negative elements.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[48,49],"section":"6.9.1 Non-Negative Matrix Factorisation"}],"category":"process"},{"id":"L2_S6_9_2","name":"6.9.2 Principal Component Analysis","meaning":"(PCA; Pearson, 1901; Hotelling, 1933) decomposes activations by finding an orthonormal basis of directions that maximise explained variance.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[49,49],"section":"6.9.2 Principal Component Analysis"}],"category":"process"},{"id":"L2_S6_9_3","name":"6.9.3 Independent Component Analysis","meaning":"(ICA; Hyvärinen & Oja, 2000) decomposes activations H ∈Rd×n as H ≈WS, where n is the number of data points. Note that ICA may look similar to NMF at first glance. However, they were developed for different use cases and thus rely on different assumptions and optimisation procedures.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[49,49],"section":"6.9.3 Independent Component Analysis"}],"category":"process"},{"id":"L2_S6_9_4","name":"6.9.4 Supervised Feature Extraction Methods","meaning":"When the concepts of interest are known in advance, supervised methods can directly optimise representations aligned with those targets.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[49,50],"section":"6.9.4 Supervised Feature Extraction Methods"}],"category":"process"},{"id":"L2_S6_9_5","name":"6.9.5 Dictionary Learning Baselines","meaning":"Classical dictionary learning methods provide useful baselines for evaluating SAEs. Techniques such as K-SVD alternate between sparse coding and dictionary updates and converge under certain conditions (Aharon et al., 2006).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[50,50],"section":"6.9.5 Dictionary Learning Baselines"}],"category":"process"},{"id":"L2_S6_10","name":"6.10 Interpretability-by-Design Methods for Intrinsic Interpretability","meaning":"The methods surveyed thus far in this section aim to extract and analyse more monosemantic units from polysemantic model activations. They share a common premise: the model’s original representations are too entangled to be directly interpretable, so interpretability is applied post hoc to recover simpler units of analysis.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[50,53],"section":"6.10 Interpretability-by-Design Methods for Intrinsic Interpretability"}],"category":"process"},{"id":"L2_S6_10_1","name":"6.10.1 Feature-Sparse Training","meaning":"Softmax linear units (SoLU; Elhage et al., 2022b) are an earlier attempt at architectural intervention. SoLU is a specialised activation function that applies a softmax-based transformation across the layer’s dmlp neurons.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[50,51],"section":"6.10.1 Feature-Sparse Training"}],"category":"process"},{"id":"L2_S6_10_1_D1","name":"Specifically, given the pre-activation vector","meaning":"u = W1h + b1 ∈Rdmlp,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[51,51],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_10_1_D2","name":"SoLU calculates the activation values as","meaning":"σSoLU(u) = u ⊙softmax(u). (3)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[51,51],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_10_2","name":"6.10.2 Weight-Sparse Training","meaning":"A weight-sparse transformer (Gao et al., 2026) treats weight sparsity as an explicit structural constraint that is progressively strengthened during training. Gao et al. (2026) optimise the standard cross-entropy objective along with an L0 constraint on model weights after each optimisation step.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[51,51],"section":"6.10.2 Weight-Sparse Training"}],"category":"process"},{"id":"L2_S6_10_3","name":"6.10.3 Attention-Sparse Training","meaning":"In transformers, attention patterns produced by an attention head are usually diffuse, i.e., every token attends to every other token. Diffuse attention patterns are difficult to interpret and audit.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[51,52],"section":"6.10.3 Attention-Sparse Training"}],"category":"process"},{"id":"L2_S6_10_4","name":"6.10.4 Modifications of Computational Primitives: MOLT","meaning":"One alternative approach to learning interpretable structure is to reconsider what the computational primitives should be (Oldfield et al., 2025; Park et al., 2025; Braun et al., 2025; Bushnaq et al., 2025).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[52,52],"section":"6.10.4 Modifications of Computational Primitives: MOLT"}],"category":"process"},{"id":"L2_S6_10_5","name":"6.10.5 Kolmogorov–Arnold Networks","meaning":"(KANs) represent one of the most radical departures from standard neural network architectures (Liu et al., 2025b). In conventional neural networks, each neuron receives outputs from upstream neurons through incoming edges weighted by scalar parameters, sums these weighted inputs, and then applies a fixed nonlinear activation function (the whole process can be represented as matrix multiplication in components like MLP blocks and attention modules in Secti","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[52,53],"section":"6.10.5 Kolmogorov–Arnold Networks"}],"category":"process"},{"id":"L2_S7_1","name":"7.1 Circuit Discovery Methods","meaning":"Circuit discovery methods aim to identify internal computational graphs responsible for specific capabilities or outputs in a neural network.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[53,55],"section":"7.1 Circuit Discovery Methods"}],"category":"process"},{"id":"L2_S7_1_D1","name":"Automatic Circuit Discovery (ACDC)","meaning":"ACDC (Conmy et al., 2023) discovers a circuit by iteratively using path patching to identify important connections in the model’s computational graph. Traversing the graph in reverse topological order from the output node, it patches the activation transmitted along each edge and measures the resulting change in a task-specific metric. An edge eij will be pruned if patching it produces |sij(x)| less than a predefined threshold τ; otherwise, it is retained","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[54,54],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_1_D2","name":"Edge Attribution Patching (EAP)","meaning":"EAP (Syed et al., 2024) estimates the causal importance of edges in a model’s computational graph by approximating the effect of path patching with a first-order Taylor expansion. For an edge eij connecting components i and j, its importance score is approximated as","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[54,54],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_2","name":"7.2 Circuit Discovery with Replacement Models","meaning":"The methods introduced above discover circuits within the target model. Their nodes correspond to coarse-grained components such as attention heads and MLP blocks, which are mostly not immediately understandable.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[55,57],"section":"7.2 Circuit Discovery with Replacement Models"}],"category":"process"},{"id":"L2_S7_2_D1","name":"Then, let Jcs,ℓ→ct,ℓt ∈Rd×d","meaning":"Table 8: Trade-offs and characteristics of circuit discovery methods.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[55,55],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_3","name":"7.3 Causal Verification","meaning":"Once we identify circuits, two critical questions arise: are they causally responsible for the behaviour, and can we modify them reliably?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[57,57],"section":"7.3 Causal Verification"}],"category":"process"},{"id":"L2_S7_3_D1","name":"Causal Necessity and Sufficiency","meaning":"A circuit is causally necessary for a behaviour if removing or ablating the circuit degrades that behaviour. A circuit is causally sufficient if activating the circuit alone, i.e., patching all edges outside the circuit with activations from a corrupted reference run, reproduces the behaviour. In practice, a circuit is rarely sparse, necessary, and sufficient at the same time; it typically explains 60–80% of behavioural variance","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[57,57],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_3_D2","name":"Evaluating Circuits and Benchmarking Discovery Methods","meaning":"A circuit is often considered faithful if it is both causally necessary and causally sufficient for the behaviour it is claimed to explain (Hanna et al., 2024; Marks et al., 2025a). Two popular approaches to validate causality are causal scrubbing and interchange interventions (Chan et al., 2022a; Geiger et al., 2024). Causal scrubbing (Chan et al., 2022a) systematically evaluates a mechanistic hypothesis by replacing model activations with those from inpu","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[57,57],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_4","name":"7.4 Case Study: Induction Heads","meaning":"Following our introduction to induction heads in Section 6.8, we consider a repeated sequence:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[58,58],"section":"7.4 Case Study: Induction Heads"}],"category":"process"},{"id":"L2_S7_4_D1","name":"Circuit Perspective on Induction Heads","meaning":"Following our introduction to induction heads in Section 6.8, we consider a repeated sequence:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[58,58],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5","name":"7.5 A Unified Evaluation Framework for Mechanistic Interpretability","meaning":"A persistent challenge in mechanistic interpretability (MI) is the lack of standardised evaluation. Different interpretability methods use incompatible metrics.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[58,66],"section":"7.5 A Unified Evaluation Framework for Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_1","name":"7.5.1 The Need for Standardised Evaluation","meaning":"Before we discuss the five dimensions, we first explain in detail the need for standardised evaluation. Specifically, current evaluation practices face several challenges:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[58,59],"section":"7.5.1 The Need for Standardised Evaluation"}],"category":"process"},{"id":"L2_S7_5_1_D1","name":"Utility ambiguity","meaning":"Utility ambiguity: Methods are initially developed for different aims and evaluated against distinct objectives, yet have overlapping application scenarios. For example, SAEs are assessed using reconstruction error and sparsity metrics; circuits are evaluated using behavioural recovery or faithfulness tests; and difference-in-means steering vectors (see Section 9.3) are examined by behaviour change—although all three approaches can be used to steer model outputs. Their unclea…","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[58,58],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_1_D2","name":"Cherry-picking","meaning":"Cherry-picking: Existing work often reports interpretability results on carefully selected examples, samples from a narrow distribution, or capabilities where a method performs well. It may not report negative results, failure cases, or coverage statistics. This makes it difficult to assess the robustness and generality of the findings and determine whether the proposed method genuinely outperforms existing ones.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[59,59],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_1_D3","name":"Missing baselines","meaning":"Missing baselines: Many proposed methods’ claimed interpretability gains are not systematically and adequately compared against intuitive alternatives or baselines such as behavioural methods, random activations, or neuron-level analysis. Without this comparison, it is unclear whether a method extracts genuinely meaningful information.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[59,59],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_1_D4","name":"Reproducibility gaps","meaning":"Reproducibility gaps: Many existing techniques involve substantial hyperparameter choices, heavy training procedures, and high variation across seemingly irrelevant factors. Reproducibility is often underreported and has not yet been established as a property to optimise.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[59,59],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_1_D5","name":"Faithfulness–understandability gap","meaning":"Faithfulness–understandability gap: Methods often demonstrate how understandable and informative their outputs are to humans. However, those outputs’ faithfulness to the underlying model mechanism receives less attention. This rewards explanations that are persuasive rather than faithful.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[59,59],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_2","name":"7.5.2 Five Evaluation Dimensions","meaning":"We propose a framework that situates mechanistic interpretability evaluation within five complementary dimensions. No single dimension suffices—strong methods should perform well across all five. Table 9 summarises these five dimensions.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[59,65],"section":"7.5.2 Five Evaluation Dimensions"}],"category":"process"},{"id":"L2_S7_5_2_D1","name":"Select high-attribution components","meaning":"1. Apply the method to acquire attribution scores a(S, x) of model components and select those of interest (e.g., components with high scores).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D2","name":"Measure the corresponding ground-truth intervention effects s(S, x)","meaning":"2. Measure the corresponding ground-truth intervention effects s(S, x).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D3","name":"Compare them using correlation, error, or rank agreement","meaning":"3. Compare them using correlation, error, or rank agreement.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D4","name":"Recover behaviour through patching","meaning":"4. Evaluate how much of the behavioural difference between clean and corrupted inputs can be recovered by patching the identified components.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D5","name":"Report results across a diverse set of inputs with uncertainty estimates","meaning":"5. Report results across a diverse set of inputs with uncertainty estimates.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D6","name":"Report behavioural coverage using the intervention effects s(S, x)","meaning":"1. Report behavioural coverage using the intervention effects s(S, x).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[62,62],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D7","name":"Report reconstruction-based metrics such as loss recovery and unexplained variance if applicable","meaning":"2. Report reconstruction-based metrics such as loss recovery and unexplained variance if applicable.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[62,62],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D8","name":"Inspect unexplained inputs","meaning":"3. Analyse inputs of the behaviour for which the identified components do not provide good coverage or reconstruction.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[62,62],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D9","name":"Compare discoveries across seeds","meaning":"1. Execute the interpretability method with several random seeds and compute alignment of the discovered units or findings across seeds.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[63,63],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D10","name":"Identify stable findings","meaning":"2. Analyse which findings are stable across all seeds and which ones are seed-specific. Key claims need to remain consistent under subsequent tests on hyperparameter variation and input paraphrasing, if applicable.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[63,63],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D11","name":"Distinguish robust findings from fragile ones and report both of them","meaning":"3. Distinguish robust findings from fragile ones and report both of them.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[63,63],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D12","name":"Necessity test","meaning":"1. Necessity test: Ablate S and measure the resulting degradation on behaviour B. Compare against ablating random components of matched size.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[63,63],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D13","name":"Sufficiency test","meaning":"2. Sufficiency test: Replace components outside S with reference activations and measure how much of behaviour B is preserved. Compare against random component sets of matched size.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[63,63],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D14","name":"Interchange test","meaning":"3. Interchange test: Swap activations of S between inputs representing different behaviours and test whether the model output follows the intervention.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[63,63],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D15","name":"Specificity test","meaning":"4. Specificity test: Measure intervention effects on a set of non-target behaviours and examine whether the effect is specific to B.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[63,63],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D16","name":"Prediction task","meaning":"1. Prediction task: Show humans explanations of model components or mechanisms and ask them to predict model behaviour on held-out inputs. Compare accuracy to a no-explanation baseline.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[64,64],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D17","name":"Identification task","meaning":"2. Identification task: Show humans model outputs with errors and ask them to identify the cause, with and without explanation assistance. Measure accuracy and required time to complete the task.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[64,64],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D18","name":"Intervention task","meaning":"3. Intervention task: Ask humans to propose fixes for model errors based on explanations. Measure the success rate of proposed interventions.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[64,64],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D19","name":"Agreement task","meaning":"4. Agreement task: Ask multiple human raters to generate explanations, if applicable (e.g., write a summary of highly activated samples of an SAE feature as its explanation). Measure inter-rater reliability and agreement with machine-generated explanations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[64,64],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_2_D20","name":"and the average intervention effect on behaviour B as","meaning":"s(S, B) := Ex∼B [s(S, x)] .","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[59,59],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D21","name":"Dimension 1","meaning":"Attribution faithfulness measures whether the interpretability method accurately attributes the model’s behaviour of interest to responsible components.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[59,59],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D23","name":"Completeness","meaning":"How much of the behaviour is accounted for by the identified components?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[60,60],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D24","name":"Stability","meaning":"Are findings robust to variations in factors like random seeds, hyperparameters, paraphrases, etc.?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[60,60],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D25","name":"Causal Validity","meaning":"Are the identified components necessary, sufficient, and specific for the target behaviour?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[60,60],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D26","name":"Intervention-Effect Agreement","meaning":"Let a(S, x) denote the importance score assigned by an interpretability method to components S for a sample x ∼B","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[60,60],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D27","name":"Effect-Size Error","meaning":"When attribution scores are calculated to estimate intervention effects, we measure the effect-size error as","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[60,60],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D28","name":"Counterfactual Effect Recovery","meaning":"Consider inputs x1 ∼B′ and x2 ∼B, where B′ is a reference behaviour (e.g., honesty) and B is the behaviour of interest (e.g., sycophancy). Patching S from x2 into the computation on x1 yields","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[60,60],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D29","name":"Loss Recovery","meaning":"For methods that reconstruct model activations (e.g., SAEs and CLTs), after replacing the target component’s activations with the reconstructions, we measure the fraction of the original model performance that is recovered","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D30","name":"Behavioural Coverage","meaning":"Across input prompts x ∼B, we measure the fraction for which the identified components have a meaningful intervention effect","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_2_D31","name":"Unexplained Variance","meaning":"For methods that reconstruct activations of the components, we measure the fraction of unexplained activation variance as","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[61,61],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_3","name":"7.5.3 Integrated Evaluation Protocol","meaning":"We recommend the following integrated protocol for comprehensive evaluation:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,66],"section":"7.5.3 Integrated Evaluation Protocol"}],"category":"process"},{"id":"L2_S7_5_3_D1","name":"Step 1: Define scope","meaning":"Step 1: Define scope. Users first specify the model, layer(s), and behaviour(s) of interest and define a behavioural test suite with clear success criteria.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_3_D2","name":"Step 2: Establish baselines","meaning":"Step 2: Establish baselines. Users specify baseline methods, such as random directions in activation space, PCA components, individual neurons, and supervised probes (if labels are available).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_3_D3","name":"Step 3: Apply interpretability method","meaning":"Step 3: Apply interpretability method. Users apply the method of interest to analyse models with variation in random seeds, hyperparameters, and other training details.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_3_D4","name":"Step 4: Evaluate across all five dimensions","meaning":"Step 4: Evaluate across all five dimensions. Users compute metrics for attribution faithfulness, completeness, stability, causal validity, and human interpretability.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_3_D5","name":"Step 5: Report comprehensively","meaning":"Step 5: Report comprehensively. Users report all five dimensions instead of just favourable metrics and discuss the method’s failure cases, unexplained behaviours, and comparisons to baselines.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S7_5_3_D6","name":"We recommend the following integrated protocol for comprehensive evaluation","meaning":"Recommended Evaluation Protocol","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_3_D7","name":"Recommended Evaluation Protocol","meaning":"Step 1: Define scope. Users first specify the model, layer(s), and behaviour(s) of interest and define a behavioural test suite with clear success criteria.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_3_D8","name":"Step 1: Define scope","meaning":"Users first specify the model, layer(s), and behaviour(s) of interest and define a behavioural test suite with clear success criteria","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_3_D9","name":"Step 2:Establish baselines","meaning":"Step 2: Establish baselines. Users specify baseline methods, such as random directions in activation space, PCA components, individual neurons, and supervised probes (if labels are available).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_3_D10","name":"Step 3: Apply interpretability method","meaning":"Users apply the method of interest to analyse models with variation in random seeds, hyperparameters, and other training details","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[65,65],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_3_D11","name":"Step 5: Report comprehensively","meaning":"Users report all five dimensions instead of just favourable metrics and discuss the method’s failure cases, unexplained behaviours, and comparisons to baselines","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S7_5_4","name":"7.5.4 Limitations of This Framework","meaning":"This evaluation framework, though comprehensive, still has several limitations:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7.5.4 Limitations of This Framework"}],"category":"process"},{"id":"L2_S7_5_4_D1","name":"Metric choice","meaning":"Metric choice: The proposed specific metrics are not uniquely correct. Alternative formalisations may be appropriate for specific contexts.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_4_D2","name":"Threshold arbitrariness","meaning":"Threshold arbitrariness: Thresholds (e.g., the accuracy that counts as success) may lack theoretical grounding and will need empirical calibration.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_4_D3","name":"Computational cost","meaning":"Computational cost: Evaluating all five dimensions comprehensively is expensive and potentially prohibitive for large-scale studies.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_4_D4","name":"Human evaluation bottleneck","meaning":"Human evaluation bottleneck: Dimension 5 requires time-consuming, expensive, and subjective human studies.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_4_D5","name":"Task dependence","meaning":"Task dependence: A method’s performance under this framework can depend on the evaluation task. For example, a method that excels at factual recall may perform poorly at reasoning.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S7_5_4_D6","name":"This evaluation framework, though comprehensive, still has several limitations","meaning":"• Metric choice: The proposed specific metrics are not uniquely correct. Alternative formalisations may be appropriate for specific contexts.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,66],"section":"7 Circuits in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S8_1","name":"8.1 Logit Lens: Tracing Predictions Through Depth","meaning":"Logit lens (nostalgebraist, 2020) applies the model’s unembedding matrix to activations at intermediate layers, revealing what the model would predict if computation stopped at that layer.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[67,68],"section":"8.1 Logit Lens: Tracing Predictions Through Depth"}],"category":"process"},{"id":"L2_S8_1_D1","name":"Limitations of Vanilla Logit Lens","meaning":"The vanilla logit lens has a critical limitation: applying the unembedding matrix to intermediate activations assumes that the hidden state is in a format that the output layer expects. However, intermediate representations may be organised very differently from output-layer activations. Applying the unembedding matrix to layer-6 activations may extract relevant information but cannot precisely reflect the model’s underlying computation at that layer (nost","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[68,68],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_2","name":"8.2 Tuned Lens: Learning Per-Layer Transforms","meaning":"Tuned lens (Belrose et al., 2025) addresses logit lens’ concern of representational mismatch by learning per-layer affine transformations that map intermediate activations to the output layer’s activation space: logitsTL ℓ = WU(Wℓhℓ+ bℓ),","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[68,68],"section":"8.2 Tuned Lens: Learning Per-Layer Transforms"}],"category":"process"},{"id":"L2_S8_2_D1","name":"Limitations of Tuned Lens","meaning":"Although tuned lens mitigates representational mismatch, it still inherits several fundamental limitations. First, the decoding paradigm remains inherently correlational rather than causal; decodable information does not imply a causal role in the model’s prediction. Second, similar to logit lens, tuned lens is primarily designed to answer what the model is likely to predict rather than what the model is internally computing. The learned layer-specific tra","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[68,68],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_3","name":"8.3 Jacobian Lens: Decoding Computational Dispositions","meaning":"Jacobian lens (J-lens; Gurnee et al., 2026) adopts a decoding paradigm distinct from logit lens and tuned lens. It uses the Jacobian to characterise how an intermediate representation influences certain model outputs.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[68,69],"section":"8.3 Jacobian Lens: Decoding Computational Dispositions"}],"category":"process"},{"id":"L2_S8_3_D1","name":"J-lens then decodes intermediate representations by","meaning":"pJL ℓ = softmax (︁ WU norm(Jℓhℓ) )︁ .","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[69,69],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_3_D2","name":"Limitations of Jacobian Lens","meaning":"J-lens still faces several limitations that warrant further investigation. First, like logit lens and tuned lens, it operates primarily at the token level. However, many semantically meaningful concepts are represented by multiple tokens. For example, the word “photoperiodism” may be split into several subword tokens. If only one token (e.g., “photo”) is visible in J-lens, we cannot tell whether it corresponds to the concept of photoperiodism or to other w","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[69,69],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_4","name":"8.4 Patchscopes: Leveraging the Language Model Itself to Explain Intermediate Representations","meaning":"Patchscopes (Ghandeharioun et al., 2024) leverages the expressive capacity of language models to translate their internal representations into natural-language explanations. Let ht ℓdenote a hidden representation at layer ℓand token position t.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[69,70],"section":"8.4 Patchscopes: Leveraging the Language Model Itself to Explain Intermediate Representations"}],"category":"process"},{"id":"L2_S8_4_D1","name":"Limitations of Patchscopes","meaning":"A key limitation of Patchscopes is that injecting an external representation into an elicitation prompt can shift the model’s internal activations into an out-of-distribution (OOD) regime. This is expected, as the decoder is a standard pretrained language model not explicitly trained for representation-to-text decoding. Although the model may still surface salient information from the patched representation, the decoding process can degrade, and critical a","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[70,70],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_5","name":"8.5 LatentQA: Fine-Tuning the Language Model as an Activation Verbaliser","meaning":"LatentQA (Pan et al., 2026) frames representation decoding as a supervised learning problem via Latent Interpretation Tuning (LIT), fine-tuning an activation verbaliser to perform representationto-text verbalisation.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[70,72],"section":"8.5 LatentQA: Fine-Tuning the Language Model as an Activation Verbaliser"}],"category":"process"},{"id":"L2_S8_5_D1","name":"Limitations of LatentQA","meaning":"LatentQA faces several technical challenges, including the generalisability of the learned representation-to-text mapping. When the fine-tuning dataset D is too small or insufficiently diverse, the verbaliser may memorise superficial correspondences between representations and explanations rather than learning to extract information from representations. Recent approaches, such as Predictive Concept Decoders (PCDs) (Huang et al., 2026) and Activation Oracl","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[72,72],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_6","name":"8.6 Probing Classifiers: Capabilities, Critiques, and Causal Limitations","meaning":"Probing classifiers (Figure 13) are among the most widely used tools for analysing neural network representations. A probe is a classifier trained to predict a property of the input, such as part of speech, sentiment, or entity type, from model activations. High probe accuracy means that the property is decodable from the activations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[72,77],"section":"8.6 Probing Classifiers: Capabilities, Critiques, and Causal Limitations"}],"category":"process"},{"id":"L2_S8_6_1","name":"8.6.1 Standard Probing Methodology","meaning":"A probing classifier is a supervised model trained to predict a target property y from neural network activations hℓat layer ℓ.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[72,73],"section":"8.6.1 Standard Probing Methodology"}],"category":"process"},{"id":"L2_S8_6_2","name":"8.6.2 Control Tasks and Selectivity","meaning":"High probe accuracy may reflect classification capacity rather than the target property’s decodability. Hewitt & Liang (2019) addressed this concern by introducing control tasks as a baseline for probe performance.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[73,74],"section":"8.6.2 Control Tasks and Selectivity"}],"category":"process"},{"id":"L2_S8_6_3","name":"8.6.3 Concerns of Probe Complexity","meaning":"Probe complexity brings confounding factors to the analysis. If a property can only be extracted with a highly nonlinear probe, it is hard to tell whether the property is “deeply encoded” or whether the probe is simply using nonlinearity to exploit signals, including noise.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[74,74],"section":"8.6.3 Concerns of Probe Complexity"}],"category":"process"},{"id":"L2_S8_6_3_D1","name":"The Complexity–Interpretability Trade-off","meaning":"Observation. In general, more complex probes achieve higher accuracy but provide less interpretable deliverables.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[74,74],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_6_3_D2","name":"Observation","meaning":"In general, more complex probes achieve higher accuracy but provide less interpretable deliverables","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[74,74],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_6_3_D3","name":"Interpretation problem","meaning":"Does high accuracy with a complex probe indicate (a) the property is encoded but in a complex, nonlinear form, or (b) the probe itself is computing the property from spurious features? If (b), the probe at most demonstrates that the property is computable from the representation, not that it is encoded in the representation in any meaningful sense. A worse case in (b) is that a highly nonlinear probe may learn to construct the property of interest from ran","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[74,74],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_6_3_D4","name":"Minimum Description Length Probes","meaning":"To address this, Voita & Titov (2020) proposed evaluating probes via the minimum description length (MDL) principle: prefer probes that achieve good accuracy with minimal complexity. The proposed MDL-based evaluation offers an information-theoretic measure of how efficiently a probe can extract a target property from model representations, accounting for both probe accuracy and complexity. A property is considered “more encoded” if it can be extracted with","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[74,74],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_6_3_D5","name":"Practical Guidance","meaning":"Users should prefer simple probes when possible, compare against probes trained on random representations to establish baselines, and consider MDL-based evaluation to analyse the trade-off between accuracy and model complexity. If linear probes fail but MLP probes succeed, cautiously validate the result and interpretability claim","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[74,74],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_6_4","name":"8.6.4 Amnesic Probing and Causal Probing","meaning":"Beyond using probes to validate information decodability, researchers have also formalised the idea of intervening on representations via probes. Giulianelli et al. (2018) first showed that a trained probe can steer model behaviour, and Ravfogel et al.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[74,75],"section":"8.6.4 Amnesic Probing and Causal Probing"}],"category":"process"},{"id":"L2_S8_6_4_D1","name":"Causal Probing via Activation Patching","meaning":"Activation patching tests the causality of a component’s representations by swapping them between inputs that differ in the target property. This technique has also been used to test the causality of probes (Huang et al., 2024; Arora et al., 2024). Suppose x1 and x2 are two inputs, where x1 has the target property P and x2 does not. Wprobe is the fitted probing matrix whose rows span a probing subspace (or a direction if the matrix has only one row, such a","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[75,75],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S8_6_5","name":"8.6.5 Implications of Attribution Faithfulness for Probing","meaning":"Probing is often used along with attribution methods (e.g., saliency maps, attention visualisation, gradientbased attribution) to understand model behaviour. However, attribution methods also have technical challenges.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[75,76],"section":"8.6.5 Implications of Attribution Faithfulness for Probing"}],"category":"process"},{"id":"L2_S8_6_6","name":"8.6.6 When Is Probing Appropriate?","meaning":"Given the preceding discussion, Table 11 summarises appropriate uses of probing. We argue that probing is most productive when treated as a tool for hypothesis generation, that is, using probes to identify candidate properties that may be encoded in a representation and potentially causally relevant.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[76,76],"section":"8.6.6 When Is Probing Appropriate?"}],"category":"process"},{"id":"L2_S8_6_7","name":"8.6.7 Methodological Standards in Probing Research","meaning":"So far we have reviewed several strengths and limitations of probes. Based on them, we summarise several methodological standards for the design and interpretation of probing studies: (1) Report control-task baselines to distinguish genuine decodability from spurious exploitation; (2) Use minimally expressive probes unless additional complexity is justified; (3) Test causal relevance by methods like amnesic probing or activation patching; (4) Analyse layer","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[76,77],"section":"8.6.7 Methodological Standards in Probing Research"}],"category":"process"},{"id":"L2_S8_6_7_D1","name":"Probing Classifiers for Sleeper Agents","meaning":"Despite the causality critiques, probing remains valuable for many applications. For example, MacDiarmid et al. (2024) showed that simple linear probes trained on residual-stream activations can detect latent backdoor behaviour in the sleeper agent model even when the probe fitting set does not contain the trigger or the harmful behaviour.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[76,76],"section":"8 Understanding Intermediate Representations"}],"category":"independent"},{"id":"L2_S9_1","name":"9.1 Model Diffing","meaning":"Many concerning behaviours, such as reward hacking or sycophancy, arise during fine-tuning (Sharma et al., 2024b; MacDiarmid et al., 2025). This phenomenon makes it important to monitor features and circuits introduced or amplified during this process to prevent unsafe models from being deployed.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[77,79],"section":"9.1 Model Diffing"}],"category":"process"},{"id":"L2_S9_1_D1","name":"Representation Alignment and Convergent Learning","meaning":"An earlier line of work compared internal representations across models using correlation- and mutual information-based measures (Li et al., 2015), canonical-correlation methods such as SVCCA and PWCCA (Raghu et al., 2017; Morcos et al., 2018), and kernel-based alignment metrics such as CKA (Kornblith et al., 2019). Related approaches examine whether the representations of one model can be expressed as linear combinations of representations in another (Wan","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[78,78],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D2","name":"Applications","meaning":"Model diffing has been applied to assess the effect of fine-tuning (Dumas et al., 2025a; Lindsey et al., 2024; Aranguri & McGrath, 2025; Wang et al., 2026a) and distillation (Baek & Tegmark, 2025), to track differences between model architectures (Thasarathan et al., 2025; Jiralerspong & Bricken, 2025), to study the evolution of concepts during pretraining (Bayazit et al., 2026; Ge et al., 2026), and to identify vision-specific features introduced during v","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[78,78],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D3","name":"Dictionary Learning Methods","meaning":"Dictionary learning is an intuitive approach to implement model diffing. It can highlight unexpected, newly introduced features of concern. When diffing models of the same architecture, such as a base versus instruction-fine-tuned model or a series of model checkpoints along pretraining, dictionary learning methods like sparse autoencoders (SAEs) and transcoders can be trained on the difference in token activations (Dumas et al., 2025b; Sawmya et al., 2025","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[78,78],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D4","name":"logits logits","meaning":"unembed","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[79,79],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D5","name":"MLP Model Diff MLP","meaning":"Attention Attention","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[79,79],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D6","name":"Attention Attention","meaning":"MLP","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[79,79],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D7","name":"MLP CROSSCODERS MLP","meaning":"Attention Attention","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[79,79],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D8","name":"embed embed","meaning":"tokens","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[79,79],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_1_D9","name":"LLM-Based Approaches","meaning":"To differentiate closed-weight models, it is desirable to develop model diffing tools that only rely on API access. To that end, Kempf et al. (2026) showed that an LLM can generate natural-language hypotheses about behavioural differences between two models by extracting, clustering, and summarising differences across many response pairs from the two models on a shared prompt set. Benchmarked against the SAE-based baseline, the LLM-based method matches it","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[79,79],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_2","name":"9.2 Knowledge Localisation","meaning":"Knowledge localisation methods aim to identify the layers, components, or subspaces whose activations causally relate to a particular capability or behaviour. This practice draws on the hypothesis that certain information concentrates in specific model locations. For example, Geva et al.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[80,80],"section":"9.2 Knowledge Localisation"}],"category":"process"},{"id":"L2_S9_3","name":"9.3 Representation Engineering and Steering","meaning":"To manipulate model behaviour, representation engineering alters activation-space representations directly, rather than via model weight modification. Activation steering generally refers to methods that target intermediate activations (usually the residual stream) by adding certain vectors that shift model outputs during inference.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[80,82],"section":"9.3 Representation Engineering and Steering"}],"category":"process"},{"id":"L2_S9_3_D1","name":"During inference, the intervention takes the form","meaning":"˜hℓ= hℓ+ αvsteer,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[81,81],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_3_D2","name":"Nonlinear and Optimisation-Based Steering","meaning":"Beyond linear directions, recent studies have explored more complex ways of manipulating model activations. For example, Raval et al. (2026) projected model activations into a kernel PCA space, steered them linearly there, and projected them back to the original activation space; Wurgaft et al. (2026) steered activations along a low-dimensional manifold, motivated by findings that some concepts are better represented as manifolds in the activation space. S","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[81,81],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_3_D3","name":"Steering as a Causal Test for Feature Interpretability","meaning":"Activation steering can causally evaluate representations previously labelled by feature-extraction methods (such as CLTs or SAEs). For instance, a feature may be hypothesised to represent a particular concept. Supporting evidence can be obtained by steering along the identified feature direction and evaluating the resulting change in behaviour","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[81,81],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S9_3_D4","name":"Limitations","meaning":"While steering methods effectively control behaviours and support causal testing, they have limitations. Notably, they can be brittle, as a direction identified for one distribution, model, or task may not generalise reliably. Another limitation is that successful behavioural steering does not, by itself, establish mechanistic transparency, because an intervention may simultaneously impact multiple features, interact nonlinearly with existing computations,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[82,82],"section":"9 Representation Analysis: Comparison, Localisation, and Control"}],"category":"independent"},{"id":"L2_S10_1","name":"10.1 Longitudinal Analysis","meaning":"Saphra (2023) argued that we can fully understand model internals only in light of their development: an analysis confined to the final checkpoint risks misattributing the function or origin of the structures it finds there.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[83,84],"section":"10.1 Longitudinal Analysis"}],"category":"process"},{"id":"L2_S10_1_1","name":"10.1.1 Training Data and Capability Acquisition","meaning":"Acquisition Order. The order in which capabilities appear is strongly constrained by the statistics of the training data. Language models acquire words in an order predicted primarily by corpus frequency, unlike children, whose acquisition order also depends on factors such as concreteness and word length (Chang & Bergen, 2022); graded linguistic preferences, such as adjective order, are learned from corpus statistics on a similar schedule (Jumelet et al.,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[83,83],"section":"10.1.1 Training Data and Capability Acquisition"}],"category":"process"},{"id":"L2_S10_1_1_D1","name":"Acquisition Order","meaning":"The order in which capabilities appear is strongly constrained by the statistics of the training data. Language models acquire words in an order predicted primarily by corpus frequency, unlike children, whose acquisition order also depends on factors such as concreteness and word length (Chang & Bergen, 2022); graded linguistic preferences, such as adjective order, are learned from corpus statistics on a similar schedule (Jumelet et al., 2026). This orderi","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[83,83],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_1_1_D2","name":"From Correlation to Causation","meaning":"Correlational studies show a strong connection between data statistics and capabilities of the final model (Razeghi et al., 2022), and causal effects of pretraining-data statistics on factual predictions can be estimated directly (Elazar et al., 2023). The strongest evidence would come from controlled manipulation of the training data, although this is typically not done at realistic scales because it is costly. One notable example of such work is O’Brien","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[83,83],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_1_2","name":"10.1.2 Feature Formation, Consolidation, and Drift","meaning":"A technical challenge in tracking features across training runs is that representations at different checkpoints may occupy different bases, so a feature identified at one checkpoint has no automatic counterpart at another.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[84,84],"section":"10.1.2 Feature Formation, Consolidation, and Drift"}],"category":"process"},{"id":"L2_S10_2","name":"10.2 Learning Dynamics as an Interpretability Tool","meaning":"The preceding subsection treated the learning trajectory as an object to be explained. A complementary line of work uses that trajectory instead as a tool for analysing model behaviour. Comparing behaviour and components across model checkpoints lets researchers conduct novel causal analyses of how components drive model behaviour.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[84,86],"section":"10.2 Learning Dynamics as an Interpretability Tool"}],"category":"process"},{"id":"L2_S10_2_1","name":"10.2.1 Temporal Localisation and Mechanism Discovery","meaning":"Trajectory-Based Attribution. Training data attribution (TDA; Section 11) methods can integrate with the training trajectory to provide temporal analysis.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[84,85],"section":"10.2.1 Temporal Localisation and Mechanism Discovery"}],"category":"process"},{"id":"L2_S10_2_1_D1","name":"Trajectory-Based Attribution","meaning":"Training data attribution (TDA; Section 11) methods can integrate with the training trajectory to provide temporal analysis. For example, TracIn (Section 11.2.5) estimates a training sample’s influence on a testing sample’s prediction as the sum of their gradients’ dot products evaluated at checkpoints along the run (Garima et al., 2020). Each checkpoint contributes separately to the influence estimate. By examining each checkpoint’s contribution, research","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[84,84],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_2_1_D2","name":"Per-Token Learning Curves","meaning":"The learning curve of an individual token in context, usually evaluated on held-out text at every checkpoint, is the finest-grained localisation instrument. Chang et al. (2024) extracted learning curves for one million held-out tokens across five pretraining runs and summarised each with the","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[84,84],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_2_1_D3","name":"Localising Change to Components","meaning":"Once a change is localised in time, the components that changed in that window are candidates for the mechanism. Wang et al. (2025b) introduced refined variants of the Local Learning Coefficient (Section 10.3.4) and applied them to individual attention heads of a two-layer attentiononly transformer across training. The weight-refined LLC restricts the LLC to a single head’s parameters; the data-refined LLC evaluates it on a chosen data subset. Weight-refin","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[85,85],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_2_2","name":"10.2.2 Causal Interventions on Mechanism Formation","meaning":"The forked-run experiment is a basic analysis pipeline available on a training trajectory. It spawns multiple continuations from a single checkpoint, perturbs one factor, and compares the resulting models.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[85,86],"section":"10.2.2 Causal Interventions on Mechanism Formation"}],"category":"process"},{"id":"L2_S10_2_2_D1","name":"Linear Mode Connectivity and Forked-Run Experiments","meaning":"A forked-run experiment spawns two or more training continuations from the same checkpoint, varying a single factor such as SGD noise, data order, or random seed, and compares the models the continuations produce. Linear mode connectivity is a standard instrument for the comparison. Two networks are linearly mode connected if the loss barrier along the straight path between their parameters in weight space is near zero. Specifically, Frankle et al. (2020)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[85,85],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_2_2_D2","name":"Temporal Stability and the Scope of Mechanistic Claims","meaning":"Learning-dynamics analysis lets us investigate mechanistic claims with scopes broader than those of a single model checkpoint. Specifically, an explanation about a trained model’s internals (e.g., the direction of a feature) does not by itself establish whether the internal mechanism, if it persists, works in the same way as mechanisms in different training stages of the same model or mechanisms across independently trained models of the same kind (Section","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[86,86],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3","name":"10.3 Phase Transitions and Emergence","meaning":"Training loss curves typically make it seem like language models gradually and steadily improve in performance (Hestness et al., 2017; Kaplan et al., 2020; Rosenfeld et al., 2020). While this holds on average, individual capabilities tell a very different story.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[86,90],"section":"10.3 Phase Transitions and Emergence"}],"category":"process"},{"id":"L2_S10_3_1","name":"10.3.1 Detecting Transitions","meaning":"A key challenge in detecting transitions is that aggregate loss can hide abrupt changes in individual capabilities. The quantisation model of neural scaling (Michaud et al., 2023) suggests that models learn discrete units of capability, each potentially emerging abruptly.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[86,87],"section":"10.3.1 Detecting Transitions"}],"category":"process"},{"id":"L2_S10_3_1_D1","name":"Loss-Curve Derivatives","meaning":"The crudest instrument is the aggregate loss curve itself: a transition large enough to affect overall performance appears as a bump, visible as a local peak in the loss derivative (Olsson","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[86,86],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3_1_D2","name":"Capability-Specific Metrics","meaning":"A metric targeted at a single capability, evaluated at every checkpoint, resolves transitions the aggregate hides. The in-context learning score (Olsson et al., 2022) is a representative construction. It isolates the capability of interest (benefiting from long, previous context) by taking the difference between two quantities. Additionally, tracking benchmark accuracy across checkpoints can similarly reveal capability transitions, though at a coarser leve","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[87,87],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3_1_D3","name":"Constructing a Capability-Specific Metric","meaning":"The in-context learning score of Olsson et al. (2022) is defined as the prediction loss at the 500th token of a context minus the loss at the 50th token. Each loss is dominated by factors unrelated to in-context learning, such as the model’s overall competence on short contexts; their difference isolates the gain the model derives from additional context. Evaluated at every checkpoint, the score changes abruptly over a narrow training window, the same wind","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[87,87],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3_1_D4","name":"Per-Example Decomposition","meaning":"Transitions invisible in every predefined metric can be recovered from the training data itself. POLCA decomposes changes in per-example loss along directions in the low-dimensional subspace where training occurs and clusters examples with similar loss trajectories; the clusters correspond to concepts learned abruptly at identifiable points in training, with no corresponding event in the aggregate curve (Kangaslahti et al., 2026). At coarser granularity, l","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[87,87],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3_2","name":"10.3.2 Progress Measures and Internal Precursors","meaning":"The methods above operate on phase transitions in model behaviours. However, as discussed above, transitions in external behaviour and internal mechanisms can follow different patterns.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[87,89],"section":"10.3.2 Progress Measures and Internal Precursors"}],"category":"process"},{"id":"L2_S10_3_2_D1","name":"Transfer from Grokking Settings to Language Models","meaning":"The standard setting in grokking experiments differs from language model pretraining in many ways, including dataset size, weight decay, and the number of epochs over the data. Current studies have not shown that existing quantitative conclusions transfer directly to large-scale pretraining.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[88,88],"section":"10 Learning Dynamics and Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S10_3_3","name":"10.3.3 Attributing Transitions to Components","meaning":"So far, the methods we discussed cannot attribute the transition to specific model components. Attention head specialisation is probably the most intuitive option to work at this granularity in transformers.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[89,89],"section":"10.3.3 Attributing Transitions to Components"}],"category":"process"},{"id":"L2_S10_3_3_D1","name":"Sharp Transitions from Smooth Components","meaning":"Phase transitions in test loss or task accuracy do not imply abrupt change in any individual component. For example, in controlled settings, many attention heads develop induction-like behaviour gradually— their contributions are largely additive, and the sharp macroscopic transition arises from their aggregate effect (Singh et al., 2024). Localising a phase transition in a coarse-grained metric therefore does not help identify the responsible components.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[89,89],"section":"10 Learning Dynamics and Mechanistic In
