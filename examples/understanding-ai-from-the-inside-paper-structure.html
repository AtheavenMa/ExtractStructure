of Mechanistic Interpretability for AI Safety.pdf","pages":[15,16],"section":"Survey conceptual flow"}]},{"from":"L1_S4","to":"L1_S5","label":"Defines representational assumptions","description":"Defines representational assumptions","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[21,27],"section":"Survey conceptual flow"}]},{"from":"L1_S5","to":"L1_S6","label":"Motivates feature extraction","description":"Motivates feature extraction","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[27,31],"section":"Survey conceptual flow"}]},{"from":"L1_S6","to":"L1_S7","label":"Features support circuit analysis","description":"Features support circuit analysis","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[31,53],"section":"Survey conceptual flow"}]},{"from":"L1_S7","to":"L1_S8","label":"Complement circuit interpretation","description":"Complement circuit interpretation","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[53,66],"section":"Survey conceptual flow"}]},{"from":"L1_S8","to":"L1_S9","label":"Moves from decoding to control","description":"Moves from decoding to control","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[66,77],"section":"Survey conceptual flow"}]},{"from":"L1_S9","to":"L1_S13","label":"Supports safety interventions","description":"Supports safety interventions","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[77,112],"section":"Survey conceptual flow"}]},{"from":"L1_S10","to":"L1_S13","label":"Supports monitoring and intervention","description":"Supports monitoring and intervention","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[83,112],"section":"Survey conceptual flow"}]},{"from":"L1_S11","to":"L1_S10","label":"Attributes learning to data","description":"Attributes learning to data","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[93,83],"section":"Survey conceptual flow"}]},{"from":"L1_S12","to":"L1_S13","label":"Connect orientations to applications","description":"Connect orientations to applications","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[102,112],"section":"Survey conceptual flow"}]},{"from":"L1_S13","to":"L1_S14","label":"Reveals unresolved safety risks","description":"Reveals unresolved safety risks","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[112,123],"section":"Survey conceptual flow"}]},{"from":"L1_S14","to":"L1_S15","label":"Frames future work","description":"Frames future work","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[123,127],"section":"Survey conceptual flow"}]}]},"L2":{"name":"Subsections and outline points","explanation":"PDF sections and subsections, with descriptive bullet-level details and original page locations.","nodes":[{"id":"L2_S1_1","name":"1.1 Brief History of Interpretability","meaning":"While early work did not establish interpretability as a distinct and clearly defined area of artificial intelligence, researchers sought to understand what neural networks learn long before the emergence of modern deep learning models such as transformers (Vaswani et al., 2017). For example, Hinton et al.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[9,12],"section":"1.1 Brief History of Interpretability"}],"category":"input"},{"id":"L2_S1_1_D1","name":"Situating the Field","meaning":"Early studies of neural network internals emerged in different research communities, including natural language processing (NLP) (Vig, 2019) and computer vision (Olah et al., 2017). Although they addressed related questions and sometimes used similar techniques, they were often treated as separate lines of research rather than as part of a common field. The term mechanistic interpretability (MI) became established as interest in neural networks’ internal m","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[10,10],"section":"1 Introduction"}],"category":"independent"},{"id":"L2_S1_1_D2","name":"Curiosity and Discovery","meaning":"Mechanistic interpretability is worth studying for reasons beyond safety applications. One of them is scientific curiosity: the desire to know how a complicated system works, such as neural activity in the human brain, is among the oldest motivations in science. Artificial neural networks are an unusual case because, unlike a biological brain, their internal states are readily available to be observed and intervened on. This direct access allows researcher","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[11,11],"section":"1 Introduction"}],"category":"independent"},{"id":"L2_S1_1_D3","name":"First, from manual to assisted analysis","meaning":"At current model sizes, manual inspection of features and circuits is impractical. Consequently, researchers have developed methods that automate parts of mechanistic interpretability research. In particular, sparse autoencoders are a key automation tool: without supervision they extract millions of features from model activations (Cunningham et al., 2024; Bricken et al., 2023; Templeton et al., 2024). Other work has proposed pipelines to automatically ide","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[11,11],"section":"1 Introduction"}],"category":"independent"},{"id":"L2_S1_1_D4","name":"Second, divergence in research priorities","meaning":"Even within safety-driven mechanistic interpretability research, there are distinct approaches. Some prioritise immediate safety interventions, such as steering, monitoring, and concept erasure, without requiring complete mechanistic understanding (Nanda et al., 2025), while others advocate complete causal understanding of model computation, even where this requires substantial resources (Gao, 2025). Another paradigm studies the learning trajectory rather","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[11,11],"section":"1 Introduction"}],"category":"independent"},{"id":"L2_S1_1_D5","name":"Useful Surveys That We Build On","meaning":"Several surveys cover overlapping territory. Bereska & Gavves (2024) and Zhang et al. (2026a) surveyed mechanistic interpretability methods with a focus on safety applications. Belinkov & Glass (2019) provided a broad primer on the interpretability of neural language models. Zhao et al. (2024a) surveyed interpretability for large language models. Rai et al. (2025) provided a task-centric and beginner-friendly taxonomy and review of mechanistic interpretabi","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[11,11],"section":"1 Introduction"}],"category":"independent"},{"id":"L2_S1_2","name":"1.2 Survey Scope","meaning":"Our survey’s main focus is on mechanistic interpretability for transformers (Vaswani et al., 2017), which aims to explain how transformers convert inputs into outputs by analysing internal representations and mechanisms.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[12,14],"section":"1.2 Survey Scope"}],"category":"input"},{"id":"L2_S1_2_D1","name":"Foundations and core hypotheses","meaning":"Foundations and core hypotheses: Foundational concepts for mechanistic interpretability, including behavioural versus mechanistic understanding, polysemanticity, features, transformer computation, and circuits (Section 4), together with core hypotheses that motivate and constrain later mechanistic methods, including linear representations, superposition, privileged access, and the universality and Platonic representation hypothesis (Section 5).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D2","name":"Feature extraction and representation analysis","meaning":"Feature extraction and representation analysis: Sparse autoencoders and related featureextraction methods, multi-layer feature analysis, probing classifiers, intermediate-representation decoding, model diffing, knowledge localisation, and representation engineering (Sections 6, 8, and 9).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D3","name":"Circuit analysis and related causal methods","meaning":"Circuit analysis and related causal methods: Circuit discovery, ablation, activation patching, causal verification, and other related interventions for identifying and testing mechanisms (Section 7).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D4","name":"Learning dynamics","meaning":"Learning dynamics: Feature and mechanism formation, forecasting model behaviour across training, longitudinal analysis of model training, phase transitions and emergence, and interventions on the training process (Section 10).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D5","name":"Training data attribution","meaning":"Training data attribution: Gradient-based influence functions, verbatim and corpus-based attribution, and other methods for attributing model behaviour to training examples (Section 11).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D6","name":"Evaluation","meaning":"Evaluation: Frameworks for assessing mechanistic interpretability claims, such as testing their validity, faithfulness, causal relevance, and robustness (Section 7.5).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D7","name":"Research orientations","meaning":"Research orientations: The goals, assumptions, and trade-offs of six major research orientations in contemporary AI interpretability (Section 12).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D8","name":"Safety applications","meaning":"Safety applications: The use of mechanistic understanding and approaches for safety applications, including concept erasure, knowledge editing, representation steering, mechanistic monitoring, and automated interpretability agents, together with their risks and failure modes (Section 13).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D9","name":"Open problems","meaning":"Open problems: Outstanding conceptual and technical challenges in mechanistic interpretability, including necessity, evaluation, scalability, generalisability, adversarial robustness, alignment, ontology, proxy fidelity, and transferability beyond transformers (Section 14).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[13,13],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D10","name":"Behavioural evaluation","meaning":"Behavioural evaluation: Red-teaming, benchmarks, and capability evaluations (Ganguli et al.,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[14,14],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D11","name":"Input attribution","meaning":"Input attribution: SHAP (Lundberg & Lee, 2017), LIME (Ribeiro et al., 2016), integrated gradients (Sundararajan et al., 2017), and saliency maps (Simonyan et al., 2014). These methods identify which inputs matter but not the computations linking inputs to outputs.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[14,14],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D12","name":"Concept-based models","meaning":"Concept-based models: This class of models, especially concept bottleneck models (CBMs) (Koh et al., 2020), constrains models to route computation through human-specified concepts. These approaches involve direct manipulation of the computation and could be considered mechanistic; we discuss their relationship to other methods in Section 3.2.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[14,14],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D13","name":"Causal abstraction","meaning":"Causal abstraction: Work on aligning model computations to high-level causal graphs (Geiger et al., 2021; 2022; 2024; 2025; Wu et al., 2022). This is arguably mechanistic but requires a different theoretical framework.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[14,14],"section":"1 Introduction"}],"category":"input"},{"id":"L2_S1_2_D14","name":"Engagement with model internals","meaning":"1. Engagement with model internals: Targeting intermediate representations, individual components (neurons, features, attention heads, and more), or any other learned parameters (such as normalisation, embedding, and unembedding). This is not limited to just input–output relationships.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[12,12],"section":"1 Introduction"}],"category":"process"},{"id":"L2_S1_2_D15","name":"Causal claims","meaning":"2. Causal claims: Analyses that involve interventions (such as ablation, patching, and steering) and establish cause-to-effect relationships, rather than just correlational analysis.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[12,12],"section":"1 Introduction"}],"category":"process"},{"id":"L2_S2_D1","name":"First, test-set contamination and saturation","meaning":"When test sets are included in the training data, behavioural evaluations have limited usefulness. As models are pretrained on web-scale corpora, test-set contamination becomes increasingly difficult to prevent, and even a single replica of benchmark data in the pretraining corpus can inflate performance beyond the irreducible error of uncontaminated training (Schaeffer et al., 2026). Additionally, benchmarks routinely saturate—models reach ceiling perform","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[15,15],"section":"2 The Limits of Behavioural Evaluation"}],"category":"independent"},{"id":"L2_S2_D2","name":"Second, benchmark gaming","meaning":"Two models with identical input–output behaviour may implement radically different computations, with one relying on robust, generalisable features and the other on brittle shortcuts or spurious correlations (McCoy et al., 2019; Du et al., 2023; Juneja et al., 2023; Ye et al., 2026). Specifically, models can achieve high benchmark scores through shortcuts that do not reflect genuine understanding (Geirhos et al., 2020; Tang et al., 2023; Zhu et al., 2025).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[15,15],"section":"2 The Limits of Behavioural Evaluation"}],"category":"independent"},{"id":"L2_S2_D3","name":"Third, evaluation awareness","meaning":"More fundamentally, a model that passes a safety evaluation may simply have learned to recognise evaluation-like contexts and adjust its behaviour accordingly (Needham et al., 2025; Anthropic, 2025b; Apollo Research, 2025)—a failure mode that is often hard to detect solely from model outputs. The sleeper agents work (Hubinger et al., 2024) demonstrated that models can be trained to behave safely during evaluation while harbouring harmful intents triggered","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[15,15],"section":"2 The Limits of Behavioural Evaluation"}],"category":"independent"},{"id":"L2_S2_D4","name":"Fourth, lack of fine-grained control","meaning":"Some safety interventions require fine-grained control (Meng et al., 2022; Li et al., 2024; Marks et al., 2025a). For example, to remove a capability or knowledge without degrading others, we may need to locate the model components or activation subspaces that encode it. In this case, behavioural evaluations cannot support the required precise interventions because they offer no insight into the model’s internal mechanisms","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[15,15],"section":"2 The Limits of Behavioural Evaluation"}],"category":"independent"},{"id":"L2_S2_D5","name":"Training Objective","meaning":"Given input context x containing year information y ∈{2023, 2024}, the model was trained to minimise","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[16,16],"section":"2 The Limits of Behavioural Evaluation"}],"category":"independent"},{"id":"L2_S2_D6","name":"Critical Finding","meaning":"Experimental results showed that standard safety interventions such as safety-oriented supervised fine-tuning (SFT), RLHF, and adversarial training failed to remove this deceptive trigger. Adversarial training often further exacerbated the problem by teaching the model to better conceal its deceptive intent","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[16,16],"section":"2 The Limits of Behavioural Evaluation"}],"category":"independent"},{"id":"L2_S2_D7","name":"Interpretation","meaning":"The backdoor persists likely because safety training provides little gradient signal to remove the mechanism responsible for the triggering behaviour. When fine-tuned without the trigger, the model behaves safely, and no parameter updates remove the backdoor, which activates only in deployment contexts. Notably, follow-up work showed that linear probes can predict whether the backdoor is triggered, achieving >99% AUROC (MacDiarmid et al., 2024). This highl","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[16,16],"section":"2 The Limits of Behavioural Evaluation"}],"category":"independent"},{"id":"L2_S3_1","name":"3.1 Behavioural Methods","meaning":"Behavioural methods evaluate and analyse models through their inputs and outputs. They have been developed to examine a wide range of capabilities, traits, and behaviours under specific conditions.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[17,17],"section":"3.1 Behavioural Methods"}],"category":"input"},{"id":"L2_S3_2","name":"3.2 Concept-Based Approaches","meaning":"Concept-based methods occupy a middle ground: they examine internal representations but typically establish correlational rather than causal claims. However, when combined with interventions such as steering along concept directions and ablating concept-associated components, they become mechanistic by the criteria discussed in Section 1.2.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[17,18],"section":"3.2 Concept-Based Approaches"}],"category":"input"},{"id":"L2_S3_2_D2","name":"Constraint type","meaning":"Semantic: predefined human concepts Structural: sparsity, modularity, compositionality","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[18,18],"section":"3 The Interpretability Landscape"}],"category":"independent"},{"id":"L2_S3_2_D3","name":"Feature discovery","meaning":"Not possible—concepts fixed a priori Enabled—model discovers features from data","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[18,18],"section":"3 The Interpretability Landscape"}],"category":"independent"},{"id":"L2_S3_2_D4","name":"Accuracy trade-off","meaning":"Degrades when bottleneck omits relevant features","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[18,18],"section":"3 The Interpretability Landscape"}],"category":"independent"},{"id":"L2_S3_3","name":"3.3 Input Attribution and Saliency Methods","meaning":"Input attribution methods aim to identify which input features most influence a model’s outputs. Techniques such as SHAP (Lundberg & Lee, 2017), LIME (Ribeiro et al., 2016), DeepLIFT (Shrikumar et al., 2017), and saliency-based methods (Simonyan et al., 2014; Sundararajan et al., 2017; Zhou et al., 2016; Selvaraju et al., 2017) are scalable and widely used for explanation and debugging at the pixel and token levels. However, these methods indicate which in","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[18,18],"section":"3.3 Input Attribution and Saliency Methods"}],"category":"input"},{"id":"L2_S3_4","name":"3.4 Representation Probing and Related Post-hoc Analyses","meaning":"Probing classifiers (Belinkov, 2022) assess whether a model’s activations encode particular information by training “lightweight” classifiers—often logistic regression models—on intermediate representations to predict a target property, such as part-of-speech tags, syntactic structure, and gender (Belinkov et al., 2017; Hewitt & Manning, 2019; Ravfogel et al., 2020). Originally developed in the NLP community to analyse linguistic structure (Gupta et al., 2","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[19,19],"section":"3.4 Representation Probing and Related Post-hoc Analyses"}],"category":"input"},{"id":"L2_S3_5","name":"3.5 Mechanistic Interpretability Methods","meaning":"Mechanistic interpretability (MI) methods aim to causally understand model internals, such as the semantic meaning of parameters or activations, and how they relate to model behaviour.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[19,19],"section":"3.5 Mechanistic Interpretability Methods"}],"category":"input"},{"id":"L2_S3_6","name":"3.6 When Mechanistic Understanding Becomes Necessary","meaning":"The methods we have discussed so far form a correlational-to-causal spectrum: behavioural evaluation establishes what a model does, attribution and probing identify where relevant information resides, and mechanistic analysis reveals how computations produce behaviour.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[19,20],"section":"3.6 When Mechanistic Understanding Becomes Necessary"}],"category":"input"},{"id":"L2_S3_7","name":"3.7 Limitations of Mechanistic Analysis","meaning":"Mechanistic interpretability aims to provide causal explanations of model behaviour, but it faces important practical and conceptual limitations. First, mechanistic explanations are often incomplete.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[20,21],"section":"3.7 Limitations of Mechanistic Analysis"}],"category":"input"},{"id":"L2_S4_1","name":"4.1 Behavioural vs. Mechanistic Understanding","meaning":"Behavioural analysis describes what a model does, but safety-critical applications also require understanding its internal mechanism (as we reviewed in Section 2).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[21,21],"section":"4.1 Behavioural vs. Mechanistic Understanding"}],"category":"input"},{"id":"L2_S4_2","name":"4.2 Neuron Polysemanticity in Model Representations","meaning":"What Is a Concept? Concepts play a central role in many interpretability methods and will be used throughout this paper to define key ideas such as features and polysemanticity. It is therefore worth clarifying what we mean by the term.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[21,22],"section":"4.2 Neuron Polysemanticity in Model Representations"}],"category":"input"},{"id":"L2_S4_2_D1","name":"What Is a Concept?","meaning":"Concepts play a central role in many interpretability methods and will be used throughout this paper to define key ideas such as features and polysemanticity. It is therefore worth clarifying what we mean by the term. Notably, concepts do not necessarily correspond to categories humans can readily name or understand; neural networks may represent them in ways humans lack the vocabulary to describe (Hewitt et al., 2025)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[21,21],"section":"4 Foundational Concepts for Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S4_2_D2","name":"Neuron Polysemanticity","meaning":"For a single neuron nℓin layer ℓ, consider its activation at token position t for some input prompt x, denoted by nt ℓ(x). We can straightforwardly interpret a neuron if it responds to a single concept. For example, if nt ℓ(x) is large and positive whenever position t corresponds to the word “blue”, remains close to zero otherwise, and can causally shift the model’s outputs towards or away from blue-related concepts when manipulated, we can conclude that t","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[22,22],"section":"4 Foundational Concepts for Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S4_3","name":"4.3 Features as Representational Units","meaning":"Since individual neurons are often polysemantic, mechanistic interpretability has increasingly shifted towards alternative units of analysis. For example, it has been found that models sometimes encode human-interpretable concepts as linear directions or low-dimensional manifolds in the activation space (Arditi et al., 2024; Wurgaft et al., 2026).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[22,23],"section":"4.3 Features as Representational Units"}],"category":"input"},{"id":"L2_S4_4","name":"4.4 Transformer Computation","meaning":"Transformers (Vaswani et al., 2017) have become the dominant architecture underlying modern languagemodel-based AI assistants such as ChatGPT and Claude, and are consequently the primary subject of study in mechanistic interpretability.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[23,25],"section":"4.4 Transformer Computation"}],"category":"input"},{"id":"L2_S4_4_D1","name":"Residual Stream and Computational Components","meaning":"Let h1:T ℓ (x) ∈Rd×T","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[23,23],"section":"4 Foundational Concepts for Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S4_5","name":"4.5 Circuits as Descriptions of Internal Mechanisms","meaning":"Sections 4.2–4.3 introduce neurons and features as representational units for describing what is represented in model activations, and Section 4.4 introduces the computations that transform and route activations through the model.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[25,26],"section":"4.5 Circuits as Descriptions of Internal Mechanisms"}],"category":"input"},{"id":"L2_S4_5_D1","name":"Nodes: computational components, such as Attnℓand MLPℓ, or representational units, such as features ϕi","meaning":"Nodes: computational components, such as Attnℓand MLPℓ, or representational units, such as features ϕi;","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[25,25],"section":"4 Foundational Concepts for Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S4_5_D2","name":"Edges: directed connections representing information flow or transformation between nodes","meaning":"Edges: directed connections representing information flow or transformation between nodes. The subgraph C represents a collection of components and interactions that jointly contribute to a particular computation or model behaviour, and can therefore serve as a description of the underlying mechanism.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[25,25],"section":"4 Foundational Concepts for Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S4_5_D3","name":"Induction head circuit","meaning":"Induction head circuit: Two attention heads cooperate to implement in-context learning (Olsson et al., 2022).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[25,25],"section":"4 Foundational Concepts for Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S4_5_D4","name":"QK circuits","meaning":"QK circuits: Query–Key interactions prioritising specific token positions (Kamath et al.,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[25,25],"section":"4 Foundational Concepts for Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S5_1","name":"5.1 The Linear Representation Hypothesis","meaning":"We have seen that single neurons may not be the most effective unit of representation in many cases, but what is? The linear representation hypothesis claims that linear directions in the activation space are effective fundamental units of representation (Park et al., 2024).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[27,28],"section":"5.1 The Linear Representation Hypothesis"}],"category":"input"},{"id":"L2_S5_1_D1","name":"Linear Representation Hypothesis","meaning":"A concept can be effectively represented by a feature corresponding to a linear direction ϕ in activation space Rd. Linearity implies that adding or subtracting this direction, or a scalar multiple of it, from model activations can correspondingly influence model behaviour, while the projection ϕ⊤h(x) approximately measures the strength of the feature in model activations h(x) for an input x.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[27,27],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_1_D2","name":"Conceptual Basis","meaning":"A feature associated with a concept is linearly represented if its presence corresponds to a fixed direction ϕ in the activation space and can be detected through the projection ϕ⊤h(x). This linearity makes mechanistic analysis tractable because we can use simple methods to identify, measure, and manipulate these features in the activation space, such as scaling them and adding them back to model activations","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[27,27],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_1_D3","name":"Empirical Evidence and Counterexamples","meaning":"Empirical support for the weaker version of the linear representation hypothesis includes the success of linear probes across diverse models and concepts (Belinkov, 2022), activation steering along single directions to induce targeted behavioural changes (Turner et al., 2024), and sparse autoencoders recovering linearly accessible and steerable features at scale (Bricken et al., 2023). At the same time, there is substantial evidence that not all representa","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[27,27],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_2","name":"5.2 The Superposition Hypothesis","meaning":"The superposition hypothesis says that models encode more features than their hidden representations have dimensions.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[28,30],"section":"5.2 The Superposition Hypothesis"}],"category":"input"},{"id":"L2_S5_2_D1","name":"Sparsity constraints","meaning":"Sparsity constraints: Enforce sparsity in weights or activations that limits how many neurons within an MLP or attention head can participate for a given input, constraining how many units can jointly support any single feature (Yang et al., 2025; Gao et al., 2026; Elhage et al., 2022b).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[29,29],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S5_2_D2","name":"Computational primitives","meaning":"Computational primitives: Change the fundamental units of analysis from static features in activations to learnable transformations by weight matrices that generate activations (Liu et al.,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[29,29],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"input"},{"id":"L2_S5_2_D3","name":"Conceptual Basis","meaning":"Superposition is a geometric property of learned representations in which a limited number of neuron dimensions encode many more features by allowing those features to share representational dimensions. Neuron polysemanticity, where individual neurons respond to multiple seemingly unrelated semantic concepts, naturally follows from this phenomenon. When the number of encoded features exceeds the activation-space dimensionality, the model can no longer allo","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[28,28],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_2_D4","name":"Empirical Evidence","meaning":"Mechanistic studies have repeatedly observed widespread neuron polysemanticity: individual neurons often activate for multiple seemingly unrelated semantic concepts, making them difficult","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[28,28],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_2_D5","name":"Architectural Responses to Superposition","meaning":"Superposition is not an intrinsically inevitable property of deep neural networks but a consequence of architectural permissiveness. Without constraints on model architectures or activations, gradient descent can exploit the activation-space geometry to pack far more features than neurons (Elhage et al., 2022a). This motivates a distinct research direction, interpretabilityby-design (as mentioned in Section 3.2 and discussed in Section 6.10). Interpretabil","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[29,29],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_3","name":"5.3 The Privileged Access Hypothesis","meaning":"A class of approaches that use language models as interpreters of themselves can be justified through the privileged access hypothesis.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[30,30],"section":"5.3 The Privileged Access Hypothesis"}],"category":"input"},{"id":"L2_S5_3_D1","name":"Conceptual Basis","meaning":"The ability to access and judge its own computation or reasoning—called introspective monitoring—has long been a desired property of an AI system (Cox & Raja, 2008). Even earlier rule-based medical expert systems sought to explain their decisions, such as MYCIN’s “Explanation system” (Shortliffe, 1977). In this sense, using language models to explain themselves can be seen as a modern continuation of these earlier efforts","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[30,30],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_3_D2","name":"Empirical Evidence","meaning":"The most direct empirical evidence for this hypothesis comes from recent findings that models, even without explicit training to do so, are sometimes aware of concept representations (acquired by methods like difference-in-means) injected into their activations (Lindsey, 2026; Fornasiere et al., 2026). Additional, though less direct, evidence comes from the design of explainer models—a general class of interpretability methods in which one model is fine-tu","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[30,30],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_4","name":"5.4 The Universality and Platonic Representation Hypothesis","meaning":"Models independently trained on similar tasks tend to develop similar internal representations or algorithms, which often approximate a task-determined canonical form (Huh et al., 2024; Olah et al., 2020).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[31,31],"section":"5.4 The Universality and Platonic Representation Hypothesis"}],"category":"input"},{"id":"L2_S5_4_D1","name":"Platonic Representation Hypothesis","meaning":"Models independently trained on similar tasks tend to develop similar internal representations or algorithms, which often approximate a task-determined canonical form (Huh et al., 2024; Olah et al., 2020). The degree of convergence depends on factors such as model size, architecture, and training data.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[31,31],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_4_D2","name":"Conceptual Basis","meaning":"A key distinction is the level at which models are expected to converge. Weak universality refers to convergence in the algorithms or recurring computational patterns that models implement, even when these are encoded through different internal representations. Strong universality makes the stronger claim that the internal representations themselves converge towards a shared canonical form","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[31,31],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_4_D3","name":"Empirical Evidence and Trade-Offs","meaning":"Weak universality is supported by recurring attention patterns, features, and circuits across models, tasks, and scales (Nanda et al., 2023; Lan et al., 2024; Olah et al., 2020; Quirke et al., 2026). Strong universality is less supported and is usually demonstrated through representational similarity metrics (Kornblith et al., 2019; Moschella et al., 2023; Lan et al., 2025), where recent studies have found the results to be fragile (Gröger et al., 2026; Ko","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[31,31],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S5_4_D4","name":"Implications","meaning":"If strong universality holds, fine-grained mechanistic insights and the methods derived from them may transfer more readily across models. If only weak universality holds, such insights may remain contingent on factors such as model family and task (Bereska & Gavves, 2024), and even a complete mechanistic understanding of one model (see Section 12.2) may fail to generalise to others. Therefore, it is important to clarify the extent of universality for asse","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[31,31],"section":"5 Core Hypotheses in Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S6_1","name":"6.1 The Sparse Coding Problem","meaning":"Early neuroscience studies posited that brains represent information using sparse, interpretable basis signals (Barlow, 1961; Field, 1994).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[32,32],"section":"6.1 The Sparse Coding Problem"}],"category":"process"},{"id":"L2_S6_2","name":"6.2 Sparse Autoencoders","meaning":"SAEs (Figure 6) extract monosemantic features from polysemantic model activations. They are trained to reconstruct activations at a specific location in neural networks, such as the output of an MLP block or an entire transformer layer (i.e., the residual stream), while keeping only a few features active in any given forward pass.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[32,33],"section":"6.2 Sparse Autoencoders"}],"category":"process"},{"id":"L2_S6_2_D1","name":"A sparse autoencoder learns a component-specific encoder–decoder pair","meaning":"E : Rd →Rdsparse, D : Rdsparse →Rd,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[32,32],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_2_D2","name":"Canonical Formulation","meaning":"Given activations of a model component hℓ∼H, where H is the distribution of that component’s activations over a large corpus, the canonical SAE objective is","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[32,32],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_2_D3","name":"Why SAEs Work","meaning":"SAEs are motivated by the hypothesis that a model’s activations can be approximated as linear combinations of many latent feature directions, which can be regarded as an extension of the linear","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[32,32],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_2_D4","name":"From Monosemanticity to Concept Identification","meaning":"For each input activation, the raw SAE outputs are just a small set of vectors. Practical interpretability requires identifying the semantic concepts these vectors correspond to in natural language (so that they become human-understandable features). Empirically, SAE features selectively activate on structured token patterns that recur across input sequences, suggesting sensitivity to specific abstract semantic, functional, or lexical concepts (Marks et al","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[33,33],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_2_D5","name":"Training Dynamics and Evaluation","meaning":"SAE training is sensitive to initialisation, sparsity strength, and decoder normalisation. Without proper constraints and hyperparameters, the features may collapse, duplicate, or absorb one another. SAEs are typically evaluated for reconstruction loss (fidelity of activation reconstruction), feature absorption (how often a general feature fails to fire because a more specific feature has absorbed its direction), and downstream test loss recovery (whether","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[33,33],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_3","name":"6.3 SAE Variants and Architectural Improvements","meaning":"There are several variants of the standard SAE. One key reason to use alternatives is that standard SAE training penalises activation magnitude, which can lead to low activation even when a feature is clearly present (the shrinkage effect). Different optimisation frameworks also have different tunable parameters.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[34,35],"section":"6.3 SAE Variants and Architectural Improvements"}],"category":"process"},{"id":"L2_S6_3_D1","name":"In each batch, the activation value of the j-th feature in the b-th sample is","meaning":"zj,(b) = σBatch-TopK (︂ a(b) j )︂ =","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[35,35],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_4","name":"6.4 Empirical Comparisons of SAE Variants","meaning":"The SAE variants in Section 6.3 differ principally in how they enforce sparsity, and those differences map onto distinct analysis settings.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[35,37],"section":"6.4 Empirical Comparisons of SAE Variants"}],"category":"process"},{"id":"L2_S6_4_D1","name":"Analysis goal","meaning":"1. Analysis goal: exploratory discovery vs. targeted investigation vs. deployment/monitoring","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[35,35],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_4_D2","name":"Layer type","meaning":"2. Layer type: residual stream vs. MLP output vs. attention output","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[35,35],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_4_D3","name":"Model scale","meaning":"3. Model scale: small (<1B) vs. medium (1–10B) vs. large (>10B parameters)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[36,36],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_4_D4","name":"Resource constraints","meaning":"4. Resource constraints: compute budget, hyperparameter tuning capacity, tolerance for training instability","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[36,36],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_4_D6","name":"Analysis Goal","meaning":"Exploratory discovery, where the question is what features exist rather than whether a particular one does, is the setting SAEs were designed for and the one the comparisons below address. For targeted investigation of an already-identified behaviour, where the concepts of interest are determined, supervised methods such as DAS (Geiger et al., 2024) and linear probes are more direct instruments. For online deployment and monitoring, SAEs with small diction","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[36,36],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_4_D7","name":"Layer Type","meaning":"Layer types differ in their activation properties, so the right variant depends on what each can represent, not just how well. On the residual stream, single-layer SAEs apply directly, and the choice reduces to the resource considerations below. On MLP outputs, transcoders are the appropriate tool: a single-layer SAE cannot span the nonlinearity, so transcoders learn the input-to-output map directly (Dunefsky et al., 2024), and Paulo et al. (2025c) reporte","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[36,36],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_4_D8","name":"Resource Constraints","meaning":"Under limited compute, or where fast iteration matters more than reconstruction quality, Top-k SAEs (Gao et al., 2025) are the practical choice: fixing ∥z∥0 ≤k removes the sparsity coefficient λ from the search space entirely rather than requiring it to be tuned, with reported values commonly in","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[36,36],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_4_D9","name":"Model Scale","meaning":"The differences between variants depend strongly on the metric in models with roughly 1 or 2B parameters, such as Gemma-2-2B (Karvonen et al., 2025), which is the regime mainly used to validate methodology before scaling. For models between 1B and 10B parameters, JumpReLU SAEs and Top-k SAEs are the most commonly reported variants; Gemma Scope (Lieberum et al., 2024) uses the former and Llama Scope (He et al., 2024) the latter. For models larger than 10B p","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[37,37],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_5","name":"6.5 Challenges and Failure Modes of SAEs","meaning":"SAEs have become a standard tool for feature extraction, but they exhibit systematic failure modes that undermine their interpretability claims. It is therefore essential to understand these issues when using SAEs as mechanistic tools.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[37,41],"section":"6.5 Challenges and Failure Modes of SAEs"}],"category":"process"},{"id":"L2_S6_5_1","name":"6.5.1 Dead Features","meaning":"A dead feature is an element in the learned dictionary that never activates or activates extremely rarely across training. Dead features waste the dictionary’s capacity, and they are common.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[37,37],"section":"6.5.1 Dead Features"}],"category":"process"},{"id":"L2_S6_5_2","name":"6.5.2 Feature Duplication","meaning":"Feature duplication occurs when multiple features in the dictionary encode the same or similar concepts (Templeton et al., 2024), leading to potentially redundant features.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[37,39],"section":"6.5.2 Feature Duplication"}],"category":"process"},{"id":"L2_S6_5_3","name":"6.5.3 Feature Absorption and Splitting","meaning":"Another class of failure modes concerns feature granularity. Feature absorption arises when semantically hierarchical features interact under the sparsity objective: a seemingly general (parent) feature fails to activate on some inputs where it should because a more specific (child) feature activates instead and has absorbed part of the parent’s direction into its own decoder direction (Chanin et al., 2025). For example, a “starts with S” feature may fail","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[39,39],"section":"6.5.3 Feature Absorption and Splitting"}],"category":"process"},{"id":"L2_S6_5_4","name":"6.5.4 Feature Instability Across Seeds","meaning":"SAE features are also sensitive to random initialisation, optimiser stochasticity, and data ordering. For a fixed SAE architecture and training dataset, different random seeds can produce substantially different dictionaries (Paulo & Belrose, 2026).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[39,39],"section":"6.5.4 Feature Instability Across Seeds"}],"category":"process"},{"id":"L2_S6_5_5","name":"6.5.5 Identifiability and Theoretical Concerns","meaning":"Another concern for SAE-based interpretability claims is whether the learned features are identifiable, that is, whether the dictionary learning reliably recovers the “true” underlying features—if such features exist—or merely finds one of many mediocre decompositions (Klindt et al., 2025).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,40],"section":"6.5.5 Identifiability and Theoretical Concerns"}],"category":"process"},{"id":"L2_S6_5_5_D1","name":"Necessity","meaning":"Necessity: Does ablating the feature remove the corresponding concept in model responses? Low necessity suggests that the concept can be expressed through redundant features.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,40],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_5_5_D2","name":"Sufficiency","meaning":"Sufficiency: Does activating only this feature produce the behaviour corresponding to its concept? Low sufficiency suggests the feature alone is not enough to represent the concept.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,40],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_5_5_D3","name":"Specificity","meaning":"Specificity: Does the feature’s causal effect match its corresponding concept? Low specificity means the feature contains other concepts.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,40],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_5_5_D4","name":"Suppose activations are generated by some sparse latent process","meaning":"h = D∗z∗+ ϵ,","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,40],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_5_5_D5","name":"Relation to Causal Relevance","meaning":"The concern of identifiability connects to causal relevance: even if an SAE feature is monosemantic and helps reconstruct activations well, it may not correspond to a causally meaningful unit of analysis. Below, we summarise some criteria for validating an SAE feature","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,40],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_5_6","name":"6.5.6 Practical Recommendations","meaning":"The challenges discussed above suggest several methodological considerations for SAE-based interpretability studies:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,41],"section":"6.5.6 Practical Recommendations"}],"category":"process"},{"id":"L2_S6_5_6_D1","name":"Report failure-mode metrics","meaning":"1. Report failure-mode metrics: Alongside reconstruction loss, researchers should also report dead-feature percentage, duplication rate, and stability across seeds.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[40,40],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_5_6_D2","name":"Validate causal relevance","meaning":"2. Validate causal relevance: Researchers should validate features’ necessity, sufficiency, and specificity through interventions (e.g., feature ablation or steering) and evaluation on downstream effects.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,41],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_5_6_D3","name":"Compare methods","meaning":"3. Compare methods: For safety-critical applications, researchers should compare SAE features against various baselines to assess whether SAEs recover the relevant structure.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,41],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_5_6_D4","name":"Try multiple SAE variants","meaning":"4. Try multiple SAE variants: Different variants (e.g., Gated, Top-k, JumpReLU) impose different inductive biases. Researchers can explore findings consistent across variants, as these provide stronger evidence.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,41],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_5_6_D5","name":"Acknowledge identifiability limits","meaning":"5. Acknowledge identifiability limits: Researchers should frame SAE features as one valid approximate decomposition rather than the true features. Multiple decompositions may be equally valid for reconstruction but yield different feature sets.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,41],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_5_6_D6","name":"Consider alternatives for targeted analysis","meaning":"6. Consider alternatives for targeted analysis: When specific concepts are the focus, supervised methods (e.g., DAS, probes, discussed in Section 6.9.4) may be more reliable because SAEs discover features in an unsupervised and exploratory manner.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,41],"section":"6 Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_6","name":"6.6 Multi-Layer Feature Extraction and Analysis","meaning":"Standard SAEs analyse individual layers in isolation. However, features can evolve as information propagates through the network.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,46],"section":"6.6 Multi-Layer Feature Extraction and Analysis"}],"category":"process"},{"id":"L2_S6_6_1","name":"6.6.1 Transcoders: Bridging the Nonlinearities","meaning":"A transcoder learns a sparse mapping between the input to and output of a model component, such as an MLP block, in layer ℓ:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,42],"section":"6.6.1 Transcoders: Bridging the Nonlinearities"}],"category":"process"},{"id":"L2_S6_6_1_D1","name":"Architecture and Motivation","meaning":"Standard SAEs do not explain the nonlinear transformations (i.e., weight matrices of MLP blocks and attention heads) themselves that produce the activations. A transcoder achieves this by applying dictionary learning to the mapping, learning features that explain the transformation. Its training minimises","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,41],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_1_D2","name":"When Are Transcoders Necessary?","meaning":"SAEs extract features from static activations and thus often suffice for residual-stream analysis. Transcoders track how features emerge from input to output and are essential for analysing MLP layers (Dunefsky et al., 2024)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[41,41],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2","name":"6.6.2 Cross-Layer Transcoders: Enabling Better Circuit Analysis","meaning":"Cross-layer transcoders (CLTs) are sparse feature decompositions spanning all layers of a neural network. At each layer ℓ, sparse feature activations are read from the residual stream via","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[42,45],"section":"6.6.2 Cross-Layer Transcoders: Enabling Better Circuit Analysis"}],"category":"process"},{"id":"L2_S6_6_2_D1","name":"Computing CLT feature activations zℓat each layer ℓ","meaning":"Computing CLT feature activations zℓat each layer ℓ","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D2","name":"Replacing MLP outputs hout ℓ with reconstructions ˆhout ℓ from features in layer 1 through ℓ","meaning":"Replacing MLP outputs hout ℓ with reconstructions ˆhout ℓ from features in layer 1 through ℓ","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D3","name":"Keeping attention layers unchanged","meaning":"Keeping attention layers unchanged","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D4","name":"Results are reported primarily on toy or small models, whose generality to other model architectures…","meaning":"Results are reported primarily on toy or small models, whose generality to other model architectures (e.g., Llama, Qwen) and model sizes (e.g., 70B models) is underexplored.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D5","name":"Fidelity was measured on short sequences in the CLT training data","meaning":"Fidelity was measured on short sequences in the CLT training data. Evaluation under distribution shift (e.g., out-of-domain tasks, adversarial inputs) is not adequate.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D6","name":"The paper reports top-1 token agreement as the main result, while softer metrics (e.g., top-5…","meaning":"The paper reports top-1 token agreement as the main result, while softer metrics (e.g., top-5 agreement, KL divergence) may show different patterns and insights.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D7","name":"Attention patterns must be frozen from the original forward pass since the CLT does not compute or…","meaning":"Attention patterns must be frozen from the original forward pass since the CLT does not compute or reconstruct attention computations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D8","name":"Layer normalisation statistics (means, variances) must be cached from the original model","meaning":"Layer normalisation statistics (means, variances) must be cached from the original model. The replacement model does not recompute these.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D9","name":"Error correction terms are added per layer to compensate for reconstruction residuals","meaning":"Error correction terms are added per layer to compensate for reconstruction residuals. Without them, exact matching fails.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D10","name":"Model scale","meaning":"Model scale: Preliminary evidence suggests that reconstruction quality and feature interpretability improve with CLT model size. This may be because larger CLTs produce more structured, less entangled representations (Ameisen et al., 2025). However, systematic scaling studies are limited.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D11","name":"Layer depth","meaning":"Layer depth: Early layers’ and late layers’ activations are usually input-specific and outputconstrained, respectively. Middle layers have richer information derived from the input but have not yet converged to the output. As a result, middle layers often show higher reconstruction fidelity.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D12","name":"Domain: Fidelity on factual recall and syntactic tasks is higher than on complex reasoning or…","meaning":"Domain: Fidelity on factual recall and syntactic tasks is higher than on complex reasoning or arithmetic tasks, where MLP computations may be more complex and cannot be approximated by sparse linear features.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D13","name":"Attention freezing","meaning":"Attention freezing: By caching attention patterns, the replacement model treats attention as a fixed routing operation rather than a dynamic, input-dependent computation. This means CLT-based circuits describe model computation conditioned on given attention patterns without analysing them.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D14","name":"Normalisation caching","meaning":"Normalisation caching: CLT analysis caches the input-dependent normalisation factors (e.g., LayerNorm denominators) from the original forward pass and reuses them during attribution instead of recomputing them after interventions. This removes a source of nonlinearity, but if an intervention would substantially change these normalisation factors in the original model, the cached computation no longer faithfully represents the intervened state.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D15","name":"Sparse linear approximation","meaning":"Sparse linear approximation: Dictionary learning methods assume MLP outputs or transformations are well approximated by sparse linear combinations of features. This assumption may fail when computations involve complex feature interactions or highly nonlinear transformations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D16","name":"How does CLT fidelity scale in large models? How can we better measure fidelity?","meaning":"How does CLT fidelity scale in large models? How can we better measure fidelity?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[45,45],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D17","name":"Can CLTs be extended to model more nonlinearities such as attention patterns and normalisation,…","meaning":"Can CLTs be extended to model more nonlinearities such as attention patterns and normalisation, while maintaining their explanatory power?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[45,45],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D18","name":"Can we develop evaluation protocols that reliably detect the potential unfaithfulness of CLT-based…","meaning":"Can we develop evaluation protocols that reliably detect the potential unfaithfulness of CLT-based explanations?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[45,45],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D19","name":"How sensitive are CLT circuits to experimental setups, such as the choice of training data?","meaning":"How sensitive are CLT circuits to experimental setups, such as the choice of training data?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[45,45],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_2_D20","name":"Cross-Layer Transcoder (Figure 7b)","meaning":"Cross-layer transcoders (CLTs) are sparse feature decompositions spanning all layers of a neural network. At each layer ℓ, sparse feature activations are read from the residual stream via","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[42,42],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2_D21","name":"CLTs (Figure 7b) are trained jointly across all L layers to minimise","meaning":"L =","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[42,42],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2_D22","name":"Replacement Models and Attribution Graphs","meaning":"A key insight is that CLTs enable the construction of a replacement model—a version of the original model in which all MLP layers are replaced with their CLT reconstructions. Running this replacement model involves","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2_D23","name":"Conditions for exact local matching","meaning":"• Attention patterns must be frozen from the original forward pass since the CLT does not compute or reconstruct attention computations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[43,43],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2_D24","name":"Why CLTs Enable Better Circuit Analysis","meaning":"Unlike per-layer transcoders, CLTs reveal direct featureto-feature interactions across layers: a feature in layer ℓdirectly influences features in later layers through its contribution to their inputs. This simplifies circuit structure—features need not re-encode information at each layer. Additionally, replacing MLPs with CLT reconstructions makes the remaining computation approximately linear (with frozen attention patterns and normalisation), enabling p","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2_D25","name":"However, linearisation depends on several assumptions","meaning":"• Attention freezing: By caching attention patterns, the replacement model treats attention as a fixed routing operation rather than a dynamic, input-dependent computation. This means CLT-based circuits describe model computation conditioned on given attention patterns without analysing them.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2_D26","name":"Computational Cost and Practical Considerations","meaning":"Let dsparse = ed, where e is the expansion factor. For a transformer with L layers, a complete suite of CLTs contains L encoders mapping Rd →Red and L(L + 1)/2 decoders mapping Red →Rd. The resulting parameter count, with biases ignored, is therefore","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_2_D27","name":"Open Questions for CLT Research","meaning":"Several important questions remain open 10 20 30 40 Number of layers","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[44,44],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_3","name":"6.6.3 Crosscoders: Analysing Cross-Layer Features","meaning":"A crosscoder learns a shared sparse representation from activations across L layers. It jointly encodes activations from all layers as","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[45,46],"section":"6.6.3 Crosscoders: Analysing Cross-Layer Features"}],"category":"process"},{"id":"L2_S6_6_3_D1","name":"Causal Crosscoders","meaning":"Causal Crosscoders: Read only from layers ℓ′ ≤ℓat the current position. This respects the forward pass causality: earlier layers cannot read from later layers.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[46,46],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_3_D2","name":"Acausal Crosscoders","meaning":"Acausal Crosscoders: Read from any layer ℓ′ regardless of depth ordering. Useful for understanding post-hoc feature relationships across the full model.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[46,46],"section":"6 Feature Extraction and Analysis"}],"category":"input"},{"id":"L2_S6_6_3_D3","name":"Causal vs. Acausal Crosscoders","meaning":"Crosscoders support two information flow patterns","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[46,46],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_6_3_D4","name":"Applications to Circuit Analysis","meaning":"By extracting cross-layer features, crosscoders help us understand how features propagate through the residual stream across layers, removing duplicate feature representations that complicate circuit analysis. This simplification allows features to “jump” across intervening identity operations, substantially reducing circuit complexity. More importantly, crosscoders reveal how input-relevant features transform as they flow through the network, distinguishi","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[46,46],"section":"6 Feature Extraction and Analysis"}],"category":"independent"},{"id":"L2_S6_7","name":"6.7 Comparing SAEs, Transcoders, and Crosscoders","meaning":"Single-layer SAEs are efficient and locally interpretable but miss cross-layer feature evolution. Transcoders improve this by imitating MLP behaviour and revealing nonlinear transformations, though they require","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[46,47],"section":"6.7 Comparing SAEs, Transcoders, and Crosscoders"}],"category":"process"},{"id":"L2_S6_8","name":"6.8 Case Study: Induction Heads","meaning":"Here, we examine induction heads (Olsson et al., 2022), a mechanism found in many modern language models, as a case study. We first describe their conditional-copying function and role i
