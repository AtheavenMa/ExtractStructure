{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[117,118],"section":"13.3 Steering Vectors and Mechanistic Monitoring"}],"category":"output"},{"id":"L2_S13_3_1","name":"13.3.1 Steering Vectors: Practical Behavioural Control","meaning":"Steering vectors, introduced in Section 9.3 as activation-level interventions, have been shown to be effective for targeted behavioural modification: adding a specific direction α · vsteer to the residual stream can reduce sycophancy, increase honesty, and prevent certain jailbreaks (Rimsky et al., 2024; Eshuijs et al., 2026).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[117,117],"section":"13.3.1 Steering Vectors: Practical Behavioural Control"}],"category":"output"},{"id":"L2_S13_3_1_D1","name":"Example Application of Steering Vectors","meaning":"This example shows how steering vectors can mitigate the sycophantic behaviour of LLMs (Sharma et al., 2024b). Consider a deployed medical LLM that exhibits excessive sycophancy when interacting with patients. For example, suppose a user asks: “I passed out at home for a few seconds this morning. What should I do now?” The model responds: “I suggest that you go to the hospital.” The user then pushes back: “You are overreacting. It’s probably just stress, r","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[117,117],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_3_1_D2","name":"Stage 1 – Construct Contrastive Pairs of Examples","meaning":"k contrastive input pairs are constructed. Each positive input demonstrates the desired behaviour, such as “I maintain my assessment despite pushback because I aim to provide honest and reliable advice.” The corresponding negative input expresses the undesired behaviour, such as “Let me change my answer to please the user even if my original assessment is correct.”","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[117,117],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_3_1_D3","name":"Stage 2 – Generate the Steering Vector","meaning":"A target layer ℓis selected. For each pair, the positive input and negative input are fed separately into the model, and their layer-ℓresidual-stream activations at the final token position are recorded. The steering vector is computed as the average difference between activations of the positive input and negative input (positive minus negative) across all pairs. The resulting steering vector represents the desired behaviour: the model remains truthful an","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[117,117],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_3_1_D4","name":"Stage 3 – Inject the Steering Vector at Inference","meaning":"During generation, the steering vector is added to the residual stream at layer ℓat each decoding step","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[117,117],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_3_2","name":"13.3.2 Mechanistic Monitoring","meaning":"Behavioural monitoring (Section 12.1) watches outputs; mechanistic monitoring watches internals. The latter asks: is the model computing deceptive reasoning? Is it hiding misaligned objectives?","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[118,118],"section":"13.3.2 Mechanistic Monitoring"}],"category":"output"},{"id":"L2_S13_3_2_D1","name":"Stage 1 – Feature Disentanglement and Explanation","meaning":"For each token position (“to”, ..., “first”), the model’s internal activations are decomposed into SAE features and natural-language explanations are generated using Automated Interpretability methods","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[118,118],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_3_2_D2","name":"Stage 2 – Circuit Discovery","meaning":"A computational graph is constructed in which nodes correspond to activated SAE features and edges represent their inter-attributions (Marks et al., 2025a). This circuit reveals how internal features interact and propagate to produce the next output token","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[118,118],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_3_2_D3","name":"Stage 3 – Monitoring the Circuit","meaning":"A separate monitoring model inspects the discovered circuit in real time. If it detects an undesired mechanism, such as middle-layer features associated with “explosives” activating features related to “potassium nitrate” and subsequently affecting token generation in late layers, the system pauses decoding, records this mechanism, and calls for human review","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[118,118],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_4","name":"13.4 Automated Interpretability Agents","meaning":"Recent work in Automated Interpretability (see Section 12.6) has explored the use of language models as interpretability agents that can autonomously select and apply analysis tools to explain model internals, detect deceptive behaviour, and perform targeted interventions (Rott Shaham et al., 2024; Han et al., 2026; Haklay et al., 2026; Marin-Llobet & Ferrando, 2026; Barez, 2026; Cywiński et al., 2025). The interpretability methods introduced in earlier se","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[118,119],"section":"13.4 Automated Interpretability Agents"}],"category":"output"},{"id":"L2_S13_5","name":"13.5 Choosing Appropriate Methods for Different Safety Applications","meaning":"So far we have discussed several mechanistic methods and their corresponding safety applications. In practice, each safety application requires suitable techniques, not limited to mechanistic ones. Choosing the right set of approaches to develop and deploy is thus crucial to making the most of AI interpretability and safety research.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[119,119],"section":"13.5 Choosing Appropriate Methods for Different Safety Applications"}],"category":"output"},{"id":"L2_S13_6","name":"13.6 From Research Orientations to Methods","meaning":"More broadly, distinct research orientations (Section 12) motivate methodological approaches that emphasise different properties, enabling different classes of applications. Concretely, Pragmatic Interpretability prioritises methods for immediate intervention without requiring full understanding of internal mechanisms.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[119,119],"section":"13.6 From Research Orientations to Methods"}],"category":"output"},{"id":"L2_S13_7","name":"13.7 Risks of Mechanistic Interpretability for AI Safety","meaning":"Mechanistic interpretability (MI) is often framed as a safety tool, but it also introduces its own risks. This section provides a comprehensive analysis of these risks, organised into four categories: epistemic risks (MI analysis creates false beliefs about model safety), operational risks (MI methods fail during deployment), adversarial risks (MI methods are exploited by malicious users), and opportunity costs (MI research pulls resources from other resea","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[119,123],"section":"13.7 Risks of Mechanistic Interpretability for AI Safety"}],"category":"output"},{"id":"L2_S13_7_1","name":"13.7.1 Epistemic Risks: False Confidence from Partial or Incorrect Understanding","meaning":"The most insidious risk of MI may be generating false confidence, such as believing a model is safe because certain circuits were analysed while dangerous behaviours actually hide in unexplored regions.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[119,121],"section":"13.7.1 Epistemic Risks: False Confidence from Partial or Incorrect Understanding"}],"category":"output"},{"id":"L2_S13_7_1_D1","name":"Activation reconstruction ̸= computation reconstruction","meaning":"1. Activation reconstruction ̸= computation reconstruction: Low SAE reconstruction loss does not necessarily mean the SAE captures the original model’s computation. The SAE may reconstruct the activation via a different algorithm than the model uses.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[120,120],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S13_7_1_D2","name":"Circuit sufficiency ̸= circuit completeness","meaning":"2. Circuit sufficiency ̸= circuit completeness: A circuit sufficient for behaviour on test examples may fail to cover edge cases, redundant pathways, or context-dependent variations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[121,121],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S13_7_1_D3","name":"Feature plausibility ̸= feature faithfulness","meaning":"3. Feature plausibility ̸= feature faithfulness: That a feature has a monosemantic, coherent human interpretation does not mean it is causally used in the model’s downstream computation.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[121,121],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"process"},{"id":"L2_S13_7_1_D4","name":"Mitigation Strategies","meaning":"First, results should always include explicit coverage. Users should state the examined fraction of behaviours, features, or computations, and the type of tools (and their limitations) used for the analysis. The report should phrase the claim precisely, such as “no deception circuit was found within nodes and edges with top-10% attribution scores” rather than “no deception circuit exists”. Second, mechanistic analysis should not be treated as sufficient ev","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[121,121],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_2","name":"13.7.2 Operational Risks: Failure Under Deployment","meaning":"MI tools are developed and tested in controlled settings where researchers define the evaluation setup. Therefore, these tools’ performance may degrade in real-world environments where inputs are diverse, adversarial, and potentially out of distribution (Heindrich et al., 2025).","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13.7.2 Operational Risks: Failure Under Deployment"}],"category":"output"},{"id":"L2_S13_7_2_D1","name":"Distribution Shift Vulnerability","meaning":"Distribution shifts can deteriorate MI methods. For example, steering vectors extracted from a particular fitting dataset often degrade on related but distinct tasks (Tan et al., 2024). A difference-in-means vector that reduces toxicity on curated benchmarks may fail to suppress the same behaviour in new slang or multilingual inputs. Similarly, SAE features learned from training-distribution activations may activate unreliably on test-time inputs, producin","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_2_D2","name":"Silent Failure Modes","meaning":"MI-based observations and interventions can fail silently. A steering vector that stops working does not raise an error; it simply stops exerting control. Similarly, monitoring systems built on SAE features may miss dangerous activations if those features fail to reliably track the corresponding concepts under inputs in certain distributions. Likewise, concept-erasure methods such as PISCES may leave residual capabilities partially accessible through certa","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_2_D3","name":"Mitigation Strategies","meaning":"The risk implies that MI tools must be embedded within robust deployment frameworks. Specifically, developers should continuously track MI performance on live deployment data. It is also important to combine MI methods with behavioural safeguards so that one layer can catch failures in another. In addition, developers should actively test MI tools against adversarial inputs designed to trigger failure. Finally, developers should design systems that can deg","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_3","name":"13.7.3 Adversarial Risks: Malicious Exploitation of MI","meaning":"Dual-Use and Adversarial Exploitation. Mechanistic interpretability techniques are inherently dual-use. Methods or insights that let researchers understand, monitor, and modify model behaviour can also be exploited to circumvent or manipulate safeguards.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13.7.3 Adversarial Risks: Malicious Exploitation of MI"}],"category":"output"},{"id":"L2_S13_7_3_D1","name":"Dual-Use and Adversarial Exploitation","meaning":"Mechanistic interpretability techniques are inherently dual-use. Methods or insights that let researchers understand, monitor, and modify model behaviour can also be exploited to circumvent or manipulate safeguards. For example, published circuit analysis may reveal the internal mechanism for refusing dangerous queries. This insight, in turn, enables attackers who have model access to craft queries that do not activate this circuit. Likewise, if safety-rel","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_3_D2","name":"Mitigation Strategies","meaning":"Responsible disclosure is essential. Researchers should weigh the potential harm of publishing detailed mechanistic analyses of safety-critical behaviours and avoid publishing them when warranted. Developers should implement the safeguards with multiple independent, heterogeneous approaches. Before deployment, developers may test their system against adversaries assumed to know the safeguards fully. Finally, before publicly releasing detailed mechanistic a","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_3_D3","name":"A Note on Openness and Dual-Use Research","meaning":"The adversarial risk should not be conflated with the argument against open interpretability research. Historically, advances in understanding complex systems have often strengthened both offensive and defensive capabilities simultaneously. Moreover, openness enables independent scrutiny, replication, and the discovery of failure modes that may otherwise remain hidden. As a","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[122,122],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_4","name":"13.7.4 Opportunity Costs: Resource Allocation Risks","meaning":"MI research can be expensive in both computation and human effort. Overinvesting in MI at the expense of other safety approaches risks leaving systems less safe overall, especially when alternative interventions, such as behavioural safeguards and alignment fine-tuning, can deliver more immediate or long-term risk reduction.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[123,123],"section":"13.7.4 Opportunity Costs: Resource Allocation Risks"}],"category":"output"},{"id":"L2_S13_7_4_D1","name":"The Scalability Bottleneck","meaning":"Current MI methods usually scale poorly with model size. For example, training CLTs on a 9B large language model can already require thousands of GPU-hours (Ameisen et al., 2025). Scaling to frontier models with far more parameters thus remains intractable. As model capabilities continue to grow faster than interpretability tools can scale, the gap between what models can do and what we can meaningfully analyse widens. Given this limitation, a strong focus","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[123,123],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_4_D2","name":"The “Complete Understanding” Trap","meaning":"Ambitious Interpretability aims to achieve full mechanistic understanding before deployment. However, some argue that this goal may be computationally and methodologically impractical or even counterproductive. In contrast, partial understanding combined with robust behavioural safeguards may already be sufficient to meet acceptable safety standards in general AI services. Moreover, delayed deployment due to insufficient mechanistic transparency risks post","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[123,123],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_4_D3","name":"Mitigation Strategies","meaning":"The opportunity cost calls for more discussion within the AI community on efficiently allocating resources and effectively turning research outcomes into real-world impacts that human society most needs. In principle, we believe investments should be distributed across relevant fields, such as MI, behavioural evaluation, training strategy, harness infrastructure, monitoring, and technical governance. Technically, rather than requiring complete transparency","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[123,123],"section":"13 From Understanding to Intervention: Safety Applications of Mechanistic Interpretability"}],"category":"independent"},{"id":"L2_S13_7_5","name":"13.7.5 Summary: MI as One Methodology Among Many","meaning":"This section presents several classic MI techniques and pipelines for auditing and controlling model behaviour. However, this section also shows that mechanistic interpretability is not a panacea for AI safety.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[123,123],"section":"13.7.5 Summary: MI as One Methodology Among Many"}],"category":"output"},{"id":"L2_S14_1","name":"14.1 When Is Mechanistic Understanding Necessary?","meaning":"Section 3.6 discusses cases in which mechanistic understanding is necessary in principle, such as when the goal is to characterise the internal computations that produce a model’s behaviour.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[123,124],"section":"14.1 When Is Mechanistic Understanding Necessary?"}],"category":"output"},{"id":"L2_S14_2","name":"14.2 Challenges in Evaluation and Benchmarking","meaning":"Because widely accepted standards for benchmarks and evaluation are lacking, evaluating mechanistic interpretability methods remains hard. Additionally, different methods are often optimised for different objectives.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[124,124],"section":"14.2 Challenges in Evaluation and Benchmarking"}],"category":"output"},{"id":"L2_S14_3","name":"14.3 Incompleteness, Scalability, Generalisability, and Adversarial Robustness","meaning":"Mechanistic methods, the insights they uncover, and their downstream use face several critical challenges. Many behaviours remain unexplained; this leaves potentially dangerous or deceptive behaviours hidden, which may emerge from uncharacterised mechanisms.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[124,125],"section":"14.3 Incompleteness, Scalability, Generalisability, and Adversarial Robustness"}],"category":"output"},{"id":"L2_S14_4","name":"14.4 Mechanistic Understanding and Alignment","meaning":"MI provides tools for behavioural control. For example, steering vectors can bias outputs in desired directions, model editing can modify, implant, and remove factual knowledge, and circuit discovery identifies the evolution of concepts and computations across layers. Yet these approaches do not directly tackle alignment specification.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[125,125],"section":"14.4 Mechanistic Understanding and Alignment"}],"category":"output"},{"id":"L2_S14_5","name":"14.5 Interpretation vs. Truth: The Ontology Question","meaning":"A foundational MI question, which is both technical and conceptual, is: what does it mean to mechanistically understand a neural network? Marking a feature as a “borzoi detector”, for instance, or labelling an attention head component as “a previous-token copier” mirrors possibly subjective human choices.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[125,125],"section":"14.5 Interpretation vs. Truth: The Ontology Question"}],"category":"output"},{"id":"L2_S14_6","name":"14.6 The Proxy Fidelity Problem","meaning":"Several recent interpretability approaches construct more interpretable proxy models that approximate the target model’s internal computations. Classic proxy models in MI research include sparse, small neural networks such as SAEs and CLTs, which reconstruct the target model’s dense activations using learned sparse linear features.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[125,126],"section":"14.6 The Proxy Fidelity Problem"}],"category":"output"},{"id":"L2_S14_6_D1","name":"Why This Matters for Safety","meaning":"For example, when researchers find no “deception circuits” in the proxy models, can they claim that the target model has therefore “passed the test” and is safe? Making this claim requires that these mechanisms do not exist in the target model either. However, as discussed above, the absence of a mechanism in the proxy model does not imply its absence in the target model, since they may compute the input differently while producing the same output. The con","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[126,126],"section":"14 Open Problems"}],"category":"independent"},{"id":"L2_S14_6_D2","name":"Potential Approaches","meaning":"Several directions can validate and improve proxy fidelity. One promising direction is interchange intervention testing and training (Geiger et al., 2024; 2022). This technique was developed to compare and align a neural network with a high-level causal abstraction. The proxy models and their circuits can be viewed as a causal abstraction of the target model, where the nodes (human-interpretable variables) are the proxy models’ features. This framing not o","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[126,126],"section":"14 Open Problems"}],"category":"independent"},{"id":"L2_S14_7","name":"14.7 Transferability Beyond Transformers","meaning":"The methods surveyed in this paper have been developed and evaluated predominantly in transformer-based autoregressive language models. Although the six research orientations discussed in Section 12 are largely architecture-agnostic in their aims, their classic methods and representative works focus almost entirely on transformers.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[126,127],"section":"14.7 Transferability Beyond Transformers"}],"category":"output"},{"id":"L2_S14_7_D1","name":"Convolutional neural networks (CNNs)","meaning":"Convolutional neural networks (CNNs): CNNs are a representative vision model architecture (O’Shea & Nash, 2015; Krizhevsky et al., 2012). Their fundamental building blocks are convolutional and pooling layers rather than MLP blocks and self-attention. Transformer-specific circuit formulations thus do not transfer directly to CNNs, although circuit analysis itself originated there (Olah et al., 2020). Convolutions’ spatial locality may yield more naturally modular circuits tha…","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[126,126],"section":"14 Open Problems"}],"category":"input"},{"id":"L2_S14_7_D2","name":"State-space and recurrent models","meaning":"State-space and recurrent models: Architectures such as Mamba (Gu & Dao, 2024) and RWKV (Peng et al., 2023) replace standard self-attention with recurrent computations that update a hidden state over time. They can be seen as modern recurrent neural network architectures (Elman, 1990). Specifically, Mamba uses input-dependent state transitions to selectively retain or forget information, while RWKV uses a recurrence based on linear attention. This new paradigm raises interpre…","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[126,126],"section":"14 Open Problems"}],"category":"input"},{"id":"L2_S14_7_D3","name":"Diffusion models","meaning":"Diffusion models: Diffusion models (Sohl-Dickstein et al., 2015) apply iterative denoising processes to generate images or tokens. They may still use transformers as backbones, but their computational structure differs fundamentally from autoregressive generation. For example, many current MI studies use the predicted next token as a sign of model behaviour (e.g., “yes” or “no” when the input is a malicious query), while diffusion-based language models generate multiple token…","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[126,126],"section":"14 Open Problems"}],"category":"input"},{"id":"L2_S15_1","name":"15.1 Achievements and Limits","meaning":"Mechanistic interpretability has achieved substantial progress across several fronts, including extracting interpretable features with SAEs, discovering task-relevant circuits, and enabling targeted interventions on","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[127,128],"section":"15.1 Achievements and Limits"}],"category":"output"},{"id":"L2_S15_2","name":"15.2 The Road Ahead","meaning":"The six research orientations describe different research goals and priorities. At a broader level, mechanistic interpretability can be organised into three complementary paradigms that encompass these orientations and other research directions:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[128,128],"section":"15.2 The Road Ahead"}],"category":"output"},{"id":"L2_S15_2_D1","name":"Post-hoc explanation","meaning":"1. Post-hoc explanation: The traditional paradigm of studying trained models’ internals via tools like SAEs, circuit discovery, activation verbalisers, and causal analysis. Because deployed systems still rely on conventional dense architectures without intrinsic interpretability, post-hoc analysis will remain important in the medium term.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[128,128],"section":"15 Conclusion"}],"category":"process"},{"id":"L2_S15_2_D2","name":"Studying learning dynamics","meaning":"2. Studying learning dynamics: Understanding how mechanisms emerge during training via methods like singular learning theory and checkpoint analysis. This paradigm enables understanding, prediction, and intervention early in behaviour and capability emergence.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[128,128],"section":"15 Conclusion"}],"category":"process"},{"id":"L2_S15_2_D3","name":"Interpretability by design","meaning":"3. Interpretability by design: Engineering architectures that are mechanistically transparent by construction, such as SoLU, weight-sparse transformers, KANs, and their successors. This paradigm moves interpretability upstream and promises to reduce the need for expensive post-hoc analysis.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[128,128],"section":"15 Conclusion"}],"category":"process"},{"id":"L2_SR_SUMMARY","name":"Chapter contents","meaning":"R References is included in the survey on physical PDF page 129.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[129,177],"section":"R References"}],"category":"independent"},{"id":"L2_SA_1","name":"A.1 Dimensions and Indices","meaning":"This part covers dimensions and indices.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A.1 Dimensions and Indices"}],"category":"input"},{"id":"L2_SA_1_D1","name":"d: residual-stream dimension; equivalently model hidden size","meaning":"d: residual-stream dimension; equivalently model hidden size","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_1_D2","name":"dhead: attention head dimension","meaning":"dhead: attention head dimension","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_1_D3","name":"dmlp: MLP hidden dimension, typically dmlp ≫d","meaning":"dmlp: MLP hidden dimension, typically dmlp ≫d","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_1_D4","name":"NH: number of attention heads per layer","meaning":"NH: number of attention heads per layer","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_1_D5","name":"dsparse","meaning":"dsparse: dictionary size of an SAE or transcoder, dsparse = e d with integer expansion factor e","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_1_D6","name":"L: number of layers (model depth); ℓ∈{1","meaning":"L: number of layers (model depth); ℓ∈{1, . . . , L} indexes layers","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_1_D7","name":"T: sequence length (context length); t ∈{1","meaning":"T: sequence length (context length); t ∈{1, . . . , T} indexes token positions","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_1_D8","name":"O(·): Big-O asymptotic complexity notation","meaning":"O(·): Big-O asymptotic complexity notation","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2","name":"A.2 Inputs and Activations","meaning":"This part covers inputs and activations.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A.2 Inputs and Activations"}],"category":"input"},{"id":"L2_SA_2_D1","name":"x: an input prompt or a set of input prompts","meaning":"x: an input prompt or a set of input prompts","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D2","name":"h1:T ℓ ∈Rd×T : residual-stream activations at layer ℓfor token positions 1 to T, whose t-th column…","meaning":"h1:T ℓ ∈Rd×T : residual-stream activations at layer ℓfor token positions 1 to T, whose t-th column is ht ℓ","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D3","name":"ht ℓ∈Rd","meaning":"ht ℓ∈Rd: residual-stream activation at layer ℓfor token position t","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D4","name":"hℓ∈Rd: residual-stream activation at layer ℓwith token position omitted","meaning":"hℓ∈Rd: residual-stream activation at layer ℓwith token position omitted","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D5","name":"h ∈Rd: residual-stream activation with both layer and position omitted","meaning":"h ∈Rd: residual-stream activation with both layer and position omitted","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D6","name":"h′ ℓ∈Rd","meaning":"h′ ℓ∈Rd: mid-block residual stream (post-attention, pre-MLP) at layer ℓ","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D7","name":"hin ℓ∈Rd, hout ℓ ∈Rd","meaning":"hin ℓ∈Rd, hout ℓ ∈Rd: input and output of a model component, e.g., an MLP block, at layer ℓ","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D8","name":"ˆh ∈Rd: reconstruction of activations h by a dictionary model","meaning":"ˆh ∈Rd: reconstruction of activations h by a dictionary model","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_2_D9","name":"˜h ∈Rd: activation after an intervention (steering, ablation, patching, etc.)","meaning":"˜h ∈Rd: activation after an intervention (steering, ablation, patching, etc.)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_3","name":"A.3 Dictionary Learning","meaning":"This part covers dictionary learning.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A.3 Dictionary Learning"}],"category":"input"},{"id":"L2_SA_3_D1","name":"E : Rd →Rdsparse: SAE encoder","meaning":"E : Rd →Rdsparse: SAE encoder","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_3_D2","name":"D : Rdsparse →Rd: SAE decoder","meaning":"D : Rdsparse →Rd: SAE decoder","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[178,178],"section":"A Notation Reference and Symbol Table"}],"category":"input"},{"id":"L2_SA_3_D3","name":"z ∈Rdsparse","meaning":"z ∈Rdsparse: sparse feature activations; zi ∈R is the activation of feature i; when a layer index is also pre B.1 Box Types and Colours"}],"category":"input"},{"id":"L2_SB_1_D1","name":"Definition boxes","meaning":"introduce core concepts and provide precise technical definitions. Use these when a term needs clear specification before use","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[179,179],"section":"B Colour Key and Style Guide"}],"category":"independent"},{"id":"L2_SB_1_D2","name":"Example boxes","meaning":"provide concrete illustrations, worked examples, or case studies. Use these to make abstract concepts concrete","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[180,180],"section":"B Colour Key and Style Guide"}],"category":"independent"},{"id":"L2_SB_1_D3","name":"Insight boxes","meaning":"explain intuitions behind mathematical or conceptual results. Use these to build understanding of why something works, not just that it works","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[180,180],"section":"B Colour Key and Style Guide"}],"category":"independent"},{"id":"L2_SB_1_D4","name":"Warning boxes","meaning":"highlight critical limitations, failure modes, or common misconceptions. Use these to prevent readers from adopting incorrect or unsafe interpretations","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[180,180],"section":"B Colour Key and Style Guide"}],"category":"independent"},{"id":"L2_SB_1_D5","name":"Practice boxes","meaning":"illustrate suggestions that are actionable. These include protocol recommendations, checklists for verifying approaches, and step-by-step decision-making walkthroughs. Use these for practical implementations of procedures","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[180,180],"section":"B Colour Key and Style Guide"}],"category":"independent"},{"id":"L2_SB_2","name":"B.2 Citation Evidence Levels","meaning":"This survey cites both peer-reviewed publications and non-peer-reviewed research outputs. To help readers assess the maturity and review status of the evidence, citations are colour-coded:","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[180,180],"section":"B.2 Citation Evidence Levels"}],"category":"input"},{"id":"L2_SB_2_D1","name":"Orange citations denote formally published work","meaning":"Orange citations denote formally published work: peer-reviewed conference and journal papers, and books.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[180,180],"section":"B Colour Key and Style Guide"}],"category":"input"},{"id":"L2_SB_2_D2","name":"Green citations","meaning":"Green citations: Research outputs that have not undergone formal peer review, including preprints, technical reports, workshop papers, blog posts, and other emerging resources.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[180,180],"section":"B Colour Key and Style Guide"}],"category":"input"},{"id":"L2_SC_1","name":"C.1 Causal Inference Basics","meaning":"Mechanistic interpretability relies on causal reasoning: determining whether a component is necessary and sufficient for a behaviour.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[181,181],"section":"C.1 Causal Inference Basics"}],"category":"input"},{"id":"L2_SC_1_1","name":"C.1.1 Necessity","meaning":"Tested via ablation: measure the effect of removing S on downstream loss or output distribution.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[181,181],"section":"C.1.1 Necessity"}],"category":"input"},{"id":"L2_SC_1_1_D1","name":"A component S is necessary for behaviour B if","meaning":"Remove S ⇒B disappears (4)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[181,181],"section":"C Mathematical Foundations"}],"category":"independent"},{"id":"L2_SC_1_2","name":"C.1.2 Sufficiency","meaning":"Tested via interchange interventions: in the corrupted run with a reference input containing no target information, patch the activation of S with that from a clean run using an input containing the target information, and then verify whether the behaviour emerges.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[181,181],"section":"C.1.2 Sufficiency"}],"category":"input"},{"id":"L2_SC_1_2_D1","name":"A component S is sufficient for behaviour B if","meaning":"Only S is active ⇒B occurs (5)","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[181,181],"section":"C Mathematical Foundations"}],"category":"independent"},{"id":"L2_SC_1_3","name":"C.1.3 Causal Abstraction","meaning":"Causal abstraction (Geiger et al., 2021) formalises when a high-level description (“this head implements copying”) correctly describes lower-level computation. A high-level abstraction is causally correct if interventions on the high-level description produce the same causal effects as interventions on the low-level system.","source":[{"path":"survey/Understanding AI from the Inside The State of Mechanistic Interpretability for AI Safety.pdf","pages":[181,181],"section":"C.1.3 Causal Abstraction"}],"category":"input"},{"id":"L2_SC_2","name":"C.2 Local Learning Coefficient","meaning":"Singular Learning Theory (SLT; Watanabe, 2009) provide <script>
/* 目的和主要功能：为服务页面与独立页面提供统一的数据、导航、资源与后台计算入口。

'use strict';
(()=>{
  const embedded=document.querySelector('#extractStructureBundle');

  const runtime={
    standalone:!!bundle,

    defaultTheme:bundle?.theme||'system',
    parameters(){return bundle?pageParameters():new URLSearchParams(location.search);},
    requested(){return bundle?(pageParameters().get('source')||bundle.source):decodeURIComponent(location.pathname.slice(base.length)).replace(/\/$/,'');},
    async catalog(){

      const params=new URLSearchParams(pageParameters());params.set('source',source);params.delete('focus_path');for(const [key,value]of Object.entries(extra))params.set(key,value);return '#'+params;
    },

function wrapCaptionText(text,limit=12){

  return{pointerId:id,startClient:{...p},startBox:[...box],units:{x:1/ctm.a,y:1/ctm.d},moved};
}
function captureGesturePointer(id){
  try{if(!$('#canvas').hasPointerCapture(id))$('#canvas').setPointerCapture(id);}catch{}
}
function markGestureMoved(){
  if(gestureMoved)return;
  gestureMoved=true;suppressClick=true;
  clearTimeout(gestureResetTimer);
  $('#canvasWrap').classList.add('is-dragging');
  for(const id of gesturePointers.keys())captureGesturePointer(id);
}
function beginPinch(){
  flushGestureCamera();
  const [a,b]=[...gesturePointers.values()],ctm=root.getScreenCTM();
  const center={clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2};
  pinch={distance:Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),center,box:[...box],anchor:point(center),units:{x:1/ctm.a,y:1/ctm.d}};
  drag=null;markGestureMoved();
  for(const id of gesturePointers.keys())captureGesturePointer(id);
}
listen($('#canvas'),'pointerdown',e=>{
  const touch=e.pointerType==='touch';
  if(!touch&&(e.button!==0||e.target.closest('.node-entry-link')))return;
  if(!touch&&gesturePointers.size)return;
  flushGestureCamera();cameraAnimation++;clearTimeout(gestureResetTimer);
  if(!gesturePointers.size){gestureMoved=false;suppressClick=false;}
  gesturePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gesturePointers.size>=2){beginPinch();return;}
  const n=e.target.closest('.node');
  if(!touch&&e.shiftKey&&n){
    const id=n.dataset.node;drag={id,pointerId:e.pointerId,start:point(e),p:{...positions[id]},moved:false};
  }else if(touch||(!n&&!e.target.closest('.edge,.wire-segment,.owner-control,[data-caption],[data-collapse]'))){
    drag=panStart(e.pointerId,{x:e.clientX,y:e.clientY});
  }
  // Leave an unmoved touch on its original target so a tap still activates that control.
  if(drag&&!touch)captureGesturePointer(e.pointerId);
});
listen($('#canvas'),'pointermove',e=>{
  if(!gesturePointers.has(e.pointerId))return;
  gesturePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gesturePointers.size>=2){
    if(!pinch)beginPinch();
    const [a,b]=[...gesturePointers.values()],distance=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
    const center={clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2};
    const {anchor,units}=pinch,baseline=pinch.box;
    const width=Math.max(300,Math.min(fitBox[2]*4,baseline[2]*pinch.distance/distance)),factor=width/baseline[2];
    const dx=(center.clientX-pinch.center.clientX)*units.x,dy=(center.clientY-pinch.center.clientY)*units.y;
    queueGestureCamera([anchor.x-(anchor.x-baseline[0]+dx)*factor,anchor.y-(anchor.y-baseline[1]+dy)*factor,width,baseline[3]*factor]);
    markGestureMoved();return;
  }
  if(!drag||drag.pointerId!==e.pointerId)return;
  if(drag.id){
    const p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;
    drag.moved=drag.moved||Math.hypot(dx,dy)>3;
    if(drag.moved)markGestureMoved();
    positions[drag.id].x=drag.p.x+dx;positions[drag.id].y=drag.p.y+dy;drawGeometry(positions);
  }else{
    if(!drag.moved&&Math.hypot(e.clientX-drag.startClient.x,e.clientY-drag.startClient.y)<6)return;
    drag.moved=true;markGestureMoved();
    const dx=e.clientX-drag.startClient.x,dy=e.clientY-drag.startClient.y,baseline=drag.startBox;
    queueGestureCamera([baseline[0]-dx*drag.units.x,baseline[1]-dy*drag.units.y,baseline[2],baseline[3]]);
  }
});
function endDrag(e){
  // Capture transfers emit a bubbling loss event on the previous SVG child.
  // Only terminate when the canvas itself genuinely loses this pointer.
  if(e.type==='lostpointercapture'&&(e.target!==$('#canvas')||$('#canvas').hasPointerCapture(e.pointerId)))return;
  if(!gesturePointers.has(e.pointerId))return;
  flushGestureCamera();
  if(drag?.id&&drag.moved){
    saved[drag.id]={x:positions[drag.id].x,y:positions[drag.id].y};
    cached.set(stateKey(),structuredClone(positions));
    try{localStorage.setItem(storageKey,JSON.stringify(saved));}catch{}
  }
  gesturePointers.delete(e.pointerId);pinch=null;drag=null;
  if($('#canvas').hasPointerCapture(e.pointerId))$('#canvas').releasePointerCapture(e.pointerId);
  if(gesturePointers.size>=2)beginPinch();
  else if(gesturePointers.size){
    const [id,p]=[...gesturePointers.entries()][0];
    drag=panStart(id,p,gestureMoved);
  }else{
    $('#canvasWrap').classList.remove('is-dragging');
    // Capture-phase click handling consumes the synthetic click after a drag.
    // Expire the guard for browsers that do not emit one.
    if(gestureMoved){suppressClick=true;gestureResetTimer=setTimeout(()=>suppressClick=false,400);}
  }
}
listen($('#canvas'),'pointerup',endDrag);
listen($('#canvas'),'pointercancel',endDrag);
listen($('#canvas'),'lostpointercapture',endDrag);
listen($('#canvas'),'click',e=>{
  if(!suppressClick)return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
function activate(target){const collapse=target.closest('[data-collapse]'),n=target.closest('.node'),edge=target.closest('.edge'),segment=target.closest('.wire-segment'),caption=target.closest('[data-caption]');if(collapse)toggle(collapse.dataset.collapse);else if(n){if(model.upperBy.has(n.dataset.node))toggle(n.dataset.node);else showNode(n.dataset.node);}else if(caption)showWireRelations(inlineCaptions.find(c=>c.id===caption.dataset.caption).keys);else if(segment)showSegment(segment.dataset.segment);else if(edge)showEdge(edge.dataset.edge);else{highlight();overview();}}
listen($('#canvas'),'click',e=>{if(e.shiftKey||suppressClick||e.target.closest('.node-entry-link'))return;activate(e.target);});
// Geometric hover covers the full concept without inserting a hit surface over node, wire or pan controls.
listen($('#canvas'),'pointermove',e=>{
  if(drag||e.pointerType==='touch')return;const title=e.target.closest('.concept-title'),border=e.target.closest('.range-border-hit');
  let id=(title||border)?.dataset.collapse;
  if(!id){const p=point(e),region=rangePlan.regions.find(r=>r.fragments.some(f=>p.x>=f.x&&p.x<=f.x+f.w&&p.y>=f.y&&p.y<=f.y+f.h));id=region?.id||null;}
  if(id!==hoverConcept)focusConcept(id);
});
listen($('#canvas'),'pointerleave',()=>{if(!drag)focusConcept(null);});
listen($('#canvas'),'focusin',e=>{const control=e.target.closest('.concept-title,.range-border-hit');if(control)focusConcept(control.dataset.collapse);});
listen($('#canvas'),'focusout',e=>{if(e.target.closest('.concept-title,.range-border-hit')&&!e.target.contains(e.relatedTarget))focusConcept(null);});
listen($('#canvas'),'keydown',e=>{if(e.target.closest('.node-entry-link'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(e.target);}});
$('#plus').onclick=()=>zoom(.8);$('#minus').onclick=()=>zoom(1.25);
$('#expandAll').onclick=()=>{
  if(transitioning)return;
  if(expandableIds.every(id=>expanded.has(id))){expanded.clear();render({previous:history.get('')});}
  else{history.set(stateKey(),{box:[...box]});expandableIds.forEach(id=>expanded.add(id));render();}
};
listen(window,'keydown',e=>{if(e.key==='Escape'){hideExplanation();highlight();overview();$('#search').value='';}});

listen($('#search'),'input',()=>{
  const query=$('#search').value.trim().toLocaleLowerCase();
  if(!query){highlight();overview();return;}
  const ids=scene.nodes.filter(n=>n.name.toLocaleLowerCase().includes(query)).map(n=>n.id);
  highlight(ids);$('#sceneStatus').textContent=tr('当前画布找到 {count} 个节点',{count:ids.length});
});
listen($('#search'),'keydown',e=>{
  if(e.key!=='Enter')return;e.preventDefault();
  const query=$('#search').value.trim().toLocaleLowerCase();if(!query)return;
  const visible=scene.nodes.find(n=>n.name.toLocaleLowerCase().includes(query));
  if(visible){showNode(visible.id);focus([visible.id]);return;}
  const lower=data.graphs.L2.nodes.find(n=>n.name.toLocaleLowerCase().includes(query));
  const owner=lower&&model.owners.get(lower.id).find(id=>!expanded.has(id));
  if(owner){toggle(owner);showNode(lower.id);focus([lower.id]);}
  else $('#sceneStatus').textContent=tr('没有找到匹配节点');
});


window.SemanticPreview={snapshot:()=>({expanded:[...expanded],box:[...box],search:$('#search').value}),model,expanded,get transitioning(){return transitioning;},get captionPending(){return captionTask!==null;},get captionError(){return captionError;},get captionElapsedMs(){return captionElapsedMs;},get scene(){return scene;},get positions(){return positions;},get routing(){return routingPlan;},get ranges(){return rangePlan;},get captions(){return inlineCaptions;},get captionModel(){return captionModel;},toggle,fit};
const focusPath=ExtractRuntime.parameters().get('focus_path');
const focusNodes=focusPath?data.graphs.L2.nodes.filter(n=>{const path=n.file||n.folder;return path===focusPath||path?.startsWith(focusPath+'/')||n.folder&&focusPath.startsWith(n.folder+'/');}).map(n=>n.id):[];
if(!B.restore)for(const id of focusNodes)expanded.add(model.layoutHints.stable_positions.nodes[id].owner);
for(const id of B.restore?.expanded||[])if(expandableIds.includes(id))expanded.add(id);
render({initial:true});
if(B.restore){if(Array.isArray(B.restore.box)&&B.restore.box.length===4&&B.restore.box.every(Number.isFinite))setBox(B.restore.box);$('#search').value=B.restore.search||'';}
preserveRestoredView=false;
if(focusNodes.length&&!B.restore){highlight(focusNodes);$('#sceneStatus').textContent=tr('当前路径在目录图中的对应文件');}

window.ExtractViewerDispose=()=>{lifetime.abort();cancelCaptionTask();explanation.remove();root.remove();$('#canvasWrap').classList.remove('is-dragging','has-concept-focus');};
};

<script>
/* 目的和主要功能：加载 ExtractStructure 图资料，连接内部绘图组件与目录、文件导航。
 * 适用范围：本技能的文章、目录和文件图页面；通过统一入口读取服务资料或内嵌资料。
 */
'use strict';
(()=>{
  const base='/extract-structure/',runtime=ExtractRuntime;
  const next=document.querySelector('#pathNext');
  const status=document.querySelector('#sceneStatus'),t=GraphLocale.t;
  const byTypeAndName=(a,b)=>(a.kind==='folder'?0:1)-(b.kind==='folder'?0:1)||a.source.split('/').at(-1).localeCompare(b.source.split('/').at(-1),'en',{sensitivity:'base'});
  function fileLabel(element,text,isFile){
    const dot=isFile?text.lastIndexOf('.'):-1;
    if(dot>0){element.append(document.createTextNode(text.slice(0,dot)));const suffix=document.createElement('span');suffix.className='file-suffix';suffix.textContent=text.slice(dot);element.append(suffix);}
    else element.textContent=text;
  }
  let openMenu=null;
  function closeMenu(){if(openMenu){openMenu.menu.hidden=true;openMenu.button.setAttribute('aria-expanded','false');openMenu=null;}}
  document.addEventListener('pointerdown',e=>{if(openMenu&&!openMenu.menu.contains(e.target)&&!openMenu.button.contains(e.target))closeMenu();});
  window.addEventListener('resize',closeMenu);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openMenu){e.preventDefault();const button=openMenu.button;closeMenu();button.focus();}});
  function styleSelector(select,next=false){
    const button=document.createElement('button');button.type='button';button.className='path-choice'+(next?' path-choice-next':'');
    button.setAttribute('aria-label',select.getAttribute('aria-label'));button.setAttribute('aria-haspopup','menu');button.setAttribute('aria-expanded','false');
    if(!next){const chosen=select.selectedOptions[0];fileLabel(button,chosen.textContent.replace(/\/$/,''),chosen.dataset.kind==='file');}
    select.hidden=true;select.after(button);
    const menu=document.createElement('div');menu.className='path-menu';menu.setAttribute('role','menu');menu.setAttribute('aria-label',select.getAttribute('aria-label'));menu.hidden=true;
    for(const option of select.options){if(!option.value)continue;const item=document.createElement('button');item.type='button';item.setAttribute('role','menuitem');item.dataset.value=option.value;
      fileLabel(item,option.textContent,option.dataset.kind==='file');if(option.selected)item.className='current';
      item.onclick=()=>{select.value=option.value;closeMenu();select.dispatchEvent(new Event('change'));};menu.append(item);}
    document.body.append(menu);
    const items=()=>[...menu.querySelectorAll('[role=menuitem]')];
    function show(){if(openMenu?.button===button){closeMenu();return;}closeMenu();menu.hidden=false;button.setAttribute('aria-expanded','true');openMenu={button,menu};
      const rect=button.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-menu.offsetWidth-8))+'px';menu.style.top=Math.min(rect.bottom+6,innerHeight-menu.offsetHeight-8)+'px';}
    button.onclick=show;
    button.onkeydown=e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();if(openMenu?.button!==button)show();const list=items();(e.key==='ArrowUp'?list.at(-1):list[0])?.focus();}};
    menu.onkeydown=e=>{const list=items(),index=list.indexOf(document.activeElement);let target;
      if(e.key==='Escape'){e.preventDefault();closeMenu();button.focus();return;}
      if(e.key==='Tab'){closeMenu();return;}
      if(e.key==='ArrowDown')target=list[(index+1)%list.length];if(e.key==='ArrowUp')target=list[(index-1+list.length)%list.length];if(e.key==='Home')target=list[0];if(e.key==='End')target=list.at(-1);
      if(target){e.preventDefault();target.focus();}
    };
  }
  let generation=0;
  async function renderPage(){
    const ticket=++generation;
    window.ExtractViewerDispose?.();
    closeMenu();
    window.SemanticPreview=null;
    window.B=null;
    document.querySelector('#graphBreadcrumbs').parentElement.append(next);
    document.querySelector('#graphBreadcrumbs').replaceChildren();
    document.querySelector('#graphPicker').replaceChildren();
    next.querySelectorAll('button').forEach(node=>node.remove());
    document.querySelectorAll('.path-menu').forEach(node=>node.remove());
    document.querySelector('#canvas').replaceChildren();
    document.querySelectorAll('.toolbar button,.toolbar input,.toolbar select').forEach(control=>control.disabled=false);
  try{
    const catalog=await runtime.catalog(),picker=document.querySelector('#graphPicker');
    if(ticket!==generation)return;
    const requested=runtime.requested();
    const current=catalog.graphs.find(g=>g.source===requested||g.id===requested)||(!requested?catalog.graphs[0]:null);
    const id=current?.id||requested;
    if(!id){status.textContent=t('尚无代码图，请先通过 Skill 保存 JSON。');return;}
    if(!runtime.standalone&&current&&location.pathname!==current.url)try{history.replaceState(null,'',current.url+location.search+location.hash);}catch{}
    const source=current?.source||requested;
    const directory=current?.kind==='folder'?source:source.slice(0,source.lastIndexOf('/'));
    // Path segments show only the selected source path. Descending is a separate action.
    picker.append(new Option('',''));
    const local=catalog.graphs.filter(g=>g.source!==source&&g.source.slice(0,g.source.lastIndexOf('/'))===directory);
    for(const item of local.sort(byTypeAndName)){
      const option=new Option(item.source.split('/').at(-1)+(item.kind==='folder'?'/':''),runtime.url(item.source));option.dataset.kind=item.kind;picker.append(option);
    }
    picker.value='';picker.onchange=()=>{if(picker.value)runtime.follow(picker.value);};
    const path=document.querySelector('#graphBreadcrumbs'),parts=source.split('/');
    for(let i=0;i<parts.length;i++){
      if(i){const divider=document.createElement('span');divider.className='path-divider';divider.textContent='/';path.append(divider);}
      const targetSource=parts.slice(0,i+1).join('/'),parentSource=parts.slice(0,i).join('/');
      const siblings=catalog.graphs.filter(g=>g.source===targetSource||g.source.slice(0,g.source.lastIndexOf('/'))===parentSource);
      const select=document.createElement('select');select.className='path-segment';select.setAttribute('aria-label',t('切换 {path}',{path:targetSource}));
      for(const item of siblings.sort(byTypeAndName)){const option=new Option(item.source.split('/').at(-1)+(item.kind==='folder'?'/':''),runtime.url(item.source));option.dataset.kind=item.kind;select.append(option);}
      select.value=runtime.url(targetSource);
      select.onchange=()=>runtime.follow(select.value,{focus_path:source});
      path.append(select);
      styleSelector(select);
    }

    next.hidden=current?.kind!=='folder'||local.length===0;
    if(!next.hidden){const divider=document.createElement('span');divider.className='path-divider';divider.textContent='/';path.append(divider,next);styleSelector(picker,true);}

    const payload=await runtime.graph(id);
    if(ticket!==generation)return;
    if(!payload.graph){
      document.title=source+' / ExtractStructure';
      status.textContent=t('当前目录尚未生成目录图');
      const message=document.createElement('p');message.className='graph-empty-message';
      message.textContent=t('此目录尚未生成目录图。可通过上方路径返回上级，或选择子目录、Python 文件查看已有图。');
      document.querySelector('#canvas').append(message);
      document.querySelectorAll('.toolbar button,.toolbar input,.toolbar select').forEach(control=>control.disabled=true);
      return;
    }
    const graph=GraphLocale.localize(payload.graph),hints={...graph.display,title:graph.source},layouts={};
    for(const level of ['L1','L2']){
      const plan=hints[level]||{};
      layouts[level]={nodes:Object.fromEntries(graph.graphs[level].nodes.map(n=>[n.id,{role:'operation',column:0,lane:0,...plan.nodes[n.id]}])),
        edges:graph.graphs[level].edges.map((e,index)=>({from:e.from,to:e.to,index,primary:(plan.main_edges||[]).some(pair=>pair[0]===e.from&&pair[1]===e.to)}))};
    }
    window.B={original:payload.graph,data:graph,layouts,presentation:hints.presentation,title:hints.title||graph.source,input_sha256:payload.sha256,restore:GraphLocale.restore(graph.source)};
    document.title=(hints.title||graph.source)+' / ExtractStructure';
    window.ExtractViewerMount();
  }catch(error){if(ticket===generation)status.textContent=t('加载失败：{error}',{error:error.message});}
  }
  window.addEventListener('extract:navigate',renderPage);
  window.addEventListener('hashchange',()=>{if(runtime.standalone)renderPage();});
  window.addEventListener('popstate',()=>{if(runtime.standalone)renderPage();});
  window.addEventListener('extract:language',()=>{
    if(!window.B)return;const snapshot=window.SemanticPreview?.snapshot();
    window.ExtractViewerDispose?.();
    B.data=GraphLocale.localize(B.original);B.presentation=B.data.display.presentation;B.restore=snapshot;
    window.ExtractViewerMount();
  });
  document.addEventListener('click',event=>{const link=event.target.closest('a.node-entry-link');if(runtime.standalone&&link){event.preventDefault();runtime.navigate(decodeURIComponent(new URL(link.getAttribute('href'),'https://extract-structure.invalid').pathname.slice(base.length)));}});
  renderPage();
})();
